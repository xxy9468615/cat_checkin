# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Machine-review policy kept in sync with CLAUDE.md rules; changes to this
# file also go through PR review. Instructions are written in English on
# purpose (repo language is en-US) so the reviewer model reads them at full
# fidelity — only downstream-parsed literal anchors stay in Chinese.
language: en-US

reviews:
  profile: assertive             # strict profile (user mandate)
  request_changes_workflow: true # auto re-review after fix pushes until no CHANGES_REQUESTED
  auto_review:
    enabled: true                # 2026-11-25: repo reached 15 stars, the >=10-star gate
                                 # has passed — every ready PR gets auto-reviewed.
                                 # (Old regime, verified 2026-10-31 at <10 stars: gate OFF,
                                 # check-run showed "skipping" (cosmetic), manual
                                 # "@coderabbitai review" comment was required.)
    drafts: false                # drafts are not reviewed; auto-starts when marked ready
  path_filters:
    - "!**/*.md"                 # docs excluded from review (the credential line of
                                 # defense is the CI secret scan).
                                 # NOTE: the leading "!" is mandatory — without it the
                                 # semantics flip to "review ONLY .md" (found 2026-11-01:
                                 # the flat-list glob was treated as include-only and
                                 # review was silently skipped for all PRs).
  path_instructions:
    - path: "scripts/**"
      instructions: >-
        This repository is a matrix of scheduled check-in / reward-claim
        automation scripts. Review priorities:
        (1) Never fabricate success — verdicts on external responses must be
        based on real protocol codes/fields; optimistic copy without evidence
        is forbidden (historical lesson: a receiverRights HTTP 500 was once
        glossed as "submitted");
        (2) Any PII shown or persisted (credentials, phone numbers,
        nicknames, emails) must go through the common.mask_str family of
        masking helpers (phones: last 4 digits only; nicknames: last 3 chars;
        emails: last 4 chars of prefix + fully masked domain);
        (3) Scheduling and window times must always be computed in Beijing
        time (BJT, UTC+8), never in local timezone;
        (4) Task scripts must NOT implement their own retry/backoff/
        circuit-breaker loops — scheduling and retries are managed solely
        by the framework orchestrator;
        (5) Test fixtures must use synthetic credentials only; synthetic
        tokens must carry the V1.0FAKE prefix; real credentials or phone
        numbers in test files are strictly forbidden.
    - path: "scripts/telecom.py"
      instructions: >-
        The telecom upstream protocol (getSingle/clientXML payloads, wapact
        gateway) mandates legacy crypto such as 3DES/AES-ECB/DES. These
        existing usages are upstream constraints — do not flag them as new
        findings. MD5 here is only used for fingerprint/state keys (e.g.
        cookie_validity), not as a security hash.
    - path: "scripts/cookie_validity.py"
      instructions: >-
        This module is the shared credential-validity engine and the single
        source of truth. Its output tag strings are parsed downstream by
        alert_levels / report_fields via literal anchors (e.g.
        "Cookie 有效期未知", "Cookie 剩余 N 天"). Before changing any tag
        copy, verify these anchors; build_tag must never emit evidence-free
        countdowns or fabricated 0-day warnings.
