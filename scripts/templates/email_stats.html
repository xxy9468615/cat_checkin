<!--
  cat_checkin 签到统计与周期分析报告模板（支持周报/月报/自定义时段）
  可用占位符：
    {{SUBJECT}}         邮件标题
    {{PERIOD_DESC}}     统计周期描述（如 2026-08-14 ~ 2026-08-20 (共 7 天)）
    {{STAT}}            核心统计概览（总签到数 / 成功数 / 失败数 / 成功率）
    {{OVERVIEW_CARDS}}  顶层指标卡片区（成功率大字、全勤站点数、异常站点数）
    {{SITE_ROWS}}       各站点周期健康度与状态点阵列表
    {{FOOTER}}          页脚
-->
<div style="margin:0;padding:16px;background:#f0f2f5;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;">
  <div style="max-width:680px;margin:0 auto;">
    <!-- 头部深色卡片 -->
    <div style="background:linear-gradient(135deg,#1a1a2e 0%,#16213e 100%);border-radius:10px 10px 0 0;padding:24px 24px 18px;">
      <div style="display:flex;align-items:center;justify-content:space-between;">
        <div style="font-size:20px;font-weight:700;color:#ffffff;letter-spacing:.3px;">{{SUBJECT}}</div>
      </div>
      <div style="margin-top:6px;font-size:13px;color:#94a3b8;">📅 {{PERIOD_DESC}}</div>
      <div style="margin-top:10px;font-size:13px;color:#e2e8f0;border-top:1px solid rgba(255,255,255,0.1);padding-top:10px;">{{STAT}}</div>
    </div>

    <!-- 概览指标卡片网格 -->
    <div style="background:#ffffff;padding:16px 20px;border-bottom:1px solid #edf2f7;">
      {{OVERVIEW_CARDS}}
    </div>

    <!-- 站点明细列表 -->
    <div style="background:#ffffff;border-radius:0 0 10px 10px;padding:16px 20px 20px;">
      <div style="font-size:14px;font-weight:600;color:#2d3748;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between;">
        <span>📊 站点运行明细与历史矩阵</span>
        <span style="font-size:11px;font-weight:normal;color:#a0aec0;">● 成功 &nbsp; ○ 失败 &nbsp; ⊘ 无记录</span>
      </div>
      {{SITE_ROWS}}
    </div>

    <!-- 页脚 -->
    <div style="padding:14px 20px;font-size:12px;color:#9aa4b0;text-align:center;">{{FOOTER}}</div>
  </div>
</div>
