name: Unit Tests & Code Quality

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/test.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Run Unit Tests & Syntax Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SHA 固定，node24)

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (SHA 固定，node24)
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Syntax check
        run: python3 -m py_compile scripts/*.py

      # 机器审核防线（2026-10-31 事件：真实电信 App Token 随测试夹具流入公开仓库
      # 长达 20+ 提交无人察觉）。高置信度凭据模式 + 已泄露值黑名单；测试夹具一律
      # 合成数据（CLAUDE.md 规则3）：合成 token 必须用 V1.0FAKE 前缀（解析器要求
      # 64 位 base64 形态，故扫描对 V1.0FAKE 前缀显式放行）。排除 *.md。
      - name: Secret scan (deny real credentials in tracked files)
        run: |
          matches=$(git grep -nE \
            -e 'V1\.0[A-Za-z0-9+/=]{50,}' \
            -e 'gh[pous]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}' \
            -e 'sk-[A-Za-z0-9]{30,}' \
            -e '17762551109|3998477332|598d26069a564aeb' \
            -- . ':!*.md' ':!.github/workflows/test.yml' || true)
          # 合成夹具白名单：V1.0FAKE 前缀 = 测试专用假 token（约定见 CLAUDE.md 规则10）
          matches=$(printf '%s\n' "$matches" | grep -v 'V1\.0FAKE' || true)
          if [ -n "$matches" ]; then
            echo "::error::检测到疑似真实凭据入库（测试只允许合成夹具），明细如下"
            echo "$matches"
            exit 1
          fi
          echo "✅ 密钥扫描通过：未发现真实凭据形态"

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Run unit test suite
        run: python3 -m unittest discover -s scripts/tests/ -p "test_*.py"
