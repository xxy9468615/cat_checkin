name: Unit Tests & Code Quality

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/test.yml'
      - '**/*.md'
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/**'
      - 'requirements.txt'
      - '.github/workflows/test.yml'
      - '**/*.md'
  workflow_dispatch:

permissions:
  contents: read

# 旧运行抢占 runner 会拖慢后续场次（md 变更现已纳入触发），过期运行直接取消
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Unit Tests & Syntax Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SHA 固定，node24)

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0 (SHA 固定，node24)
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Syntax check
        run: python3 -m py_compile scripts/*.py

      # 机器审核防线：高置信度凭据形态扫描（电信 V1.0 长串 / GitHub token /
      # OpenAI key / Telegram bot token）。测试夹具一律合成数据（CLAUDE.md
      # 规则3），合成 token 必须用 V1.0FAKE 前缀。
      # 扫描必须覆盖 *.md：CodeRabbit 评审排除 markdown（凭据防线声明在本
      # 工作流），若这里也排除则 markdown-only PR 绕过全部门禁（2026-11-01
      # 评审指认的盲区）。仅排除本文件避免模式文本自匹配。
      - name: Secret scan (deny real credentials in tracked files)
        run: |
          SCAN_PATTERNS=(
            -e 'V1\.0[A-Za-z0-9+/=]{50,}'
            -e 'gh[pous]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}'
            -e 'sk-[A-Za-z0-9]{30,}'
            -e '[0-9]{8,10}:[A-Za-z0-9_-]{30,}'
          )
          matches=$(git grep -nE "${SCAN_PATTERNS[@]}" \
            -- . ':!.github/workflows/test.yml' || true)
          # 二进制文件命中时 git grep 只输出「Binary file … matches」提示行（无内容），
          # 会被下方文本二次匹配过滤掉——必须单独保留并视为扫描失败（评审指认）
          binary_hits=$(printf '%s\n' "$matches" | grep '^Binary file ' || true)
          # 合成夹具豁免（V1.0FAKE 前缀 = 测试专用假 token，约定见 CLAUDE.md 规则10）：
          # 只剔除合成 token 本体后用同一组模式二次匹配——不得整行放行，
          # 否则同一行混排的真实凭据会漏检（2026-11-01 评审指认）
          matches=$(printf '%s\n' "$matches" \
            | sed -E 's/V1\.0FAKE[A-Za-z0-9+/=]+//g' \
            | grep -E "${SCAN_PATTERNS[@]}" || true)
          matches=$(printf '%s\n%s\n' "$matches" "$binary_hits" | sed '/^$/d')
          if [ -n "$matches" ]; then
            echo "::error::检测到疑似真实凭据/PII 入库（测试只允许合成夹具），明细如下"
            echo "$matches"
            exit 1
          fi
          echo "✅ 密钥扫描通过：未发现真实凭据形态"

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Run unit test suite
        run: python3 -m unittest discover -s scripts/tests/ -p "test_*.py"
