name: Daily Check-in (Matrix Async)

on:
  schedule:
    - cron: "50 16 * * *"  # 北京时间 00:50（GitHub Actions 低谷期）
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checkin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checkin-matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        script:
          - glados.py
          - 2libra.py
          - bianjie_ai.py
          - dji.py
          - hw_dev.py
          - monkeycode.py
          - moxing_vip.py
          - naixi_forum.py
          - pcbeta.py
          - sophnet.py
          - tencent_cloudstudio.py
          - ugnas_club.py

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set TODAY
        run: echo "TODAY=$(TZ=Asia/Shanghai date +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Cache Playwright browsers
        if: matrix.script == 'hw_dev.py'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright (hw self-heal)
        if: matrix.script == 'hw_dev.py'
        run: |
          pip install "playwright==1.61.0"
          python -m playwright install chromium --with-deps

      - name: Run check-in task (${{ matrix.script }})
        env:
          TZ: Asia/Shanghai
          TASK_OUTPUT_DIR: .task_results
          # === 站点凭证 ===
          GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
          GLADOS_EXCHANGE_PLAN: ${{ secrets.GLADOS_EXCHANGE_PLAN }}
          GLADOS_AUTO_EXCHANGE: "true"
          GLADOS_DOMAINS: glados.cloud
          "2LIBRA_COOKIES": ${{ secrets.TWO_LIBRA_COOKIES }}
          BIANJIE_AI_ACCOUNTS: ${{ secrets.BIANJIE_AI_ACCOUNTS }}
          MOXING_username: ${{ secrets.MOXING_USERNAME }}
          MOXING_password: ${{ secrets.MOXING_PASSWORD }}
          MOXING_Domain: https://moxing.vip
          MOXING_UA: ${{ secrets.MOXING_UA }}
          UGNAS_cookie: ${{ secrets.UGNAS_COOKIE }}
          PCBETA_username: ${{ secrets.PCBETA_USERNAME }}
          PCBETA_password: ${{ secrets.PCBETA_PASSWORD }}
          CLOUDSTUDIO_cookie: ${{ secrets.CLOUDSTUDIO_COOKIE }}
          CLOUDSTUDIO_xsrf: ${{ secrets.CLOUDSTUDIO_XSRF }}
          HW_DEV_cookie: ${{ secrets.HW_DEV_COOKIE }}
          HW_DEV_STATE: ${{ secrets.HW_DEV_STATE }}
          NAIXI_username: ${{ secrets.NAIXI_USERNAME }}
          NAIXI_PASSWORD: ${{ secrets.NAIXI_PASSWORD }}
          DJI_cookie: ${{ secrets.DJI_COOKIE }}
          MONKEYCODE_ACCOUNTS: ${{ secrets.MONKEYCODE_ACCOUNTS }}
          MONKEYCODE_cookie: ${{ secrets.MONKEYCODE_COOKIE }}
          MONKEYCODE_email: ${{ secrets.MONKEYCODE_EMAIL }}
          MONKEYCODE_password: ${{ secrets.MONKEYCODE_PASSWORD }}
          SOPHNET_TOKENS: ${{ secrets.SOPHNET_TOKENS }}
        run: |
          python3 scripts/run_task.py "scripts/${{ matrix.script }}"

      - name: Write back refreshed HW credentials
        if: always() && matrix.script == 'hw_dev.py' && hashFiles('.heal/*') != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::未配置 GH_PAT Secret，无法回写刷新后的 HW 凭证（本次自愈结果将在下次会话过期后丢失）"
            exit 0
          fi
          if [ -s .heal/cookie.txt ]; then
            gh secret set HW_DEV_COOKIE -R "$GITHUB_REPOSITORY" < .heal/cookie.txt
            echo "✅ HW_DEV_COOKIE 已回写"
          fi
          if [ -s .heal/state.json ]; then
            gh secret set HW_DEV_STATE -R "$GITHUB_REPOSITORY" < .heal/state.json
            echo "✅ HW_DEV_STATE 已回写"
          fi

      - name: Cache task result
        if: always()
        uses: actions/cache@v4
        with:
          path: .task_results/
          key: task-result-${{ matrix.script }}-${{ env.TODAY }}

      - name: Upload task result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-result-${{ matrix.script }}
          path: .task_results/
          retention-days: 1
          include-hidden-files: true
