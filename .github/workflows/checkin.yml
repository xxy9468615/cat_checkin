      MONKEYCODE_COOKIE_1: ${{ secrets.MONKEY_CODE_COOKIE_1 || secrets.MONKEYCODE_COOKIE_1 || secrets.MONKEY_CODE_COOKIE || secrets.MONKEYCODE_COOKIE }}
