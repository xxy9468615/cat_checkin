      NAIXI_USERNAME_1: ${{ secrets.NAIXI_USERNAME_1 || secrets.NAIXI_USERNAME }}
      NAIXI_PASSWORD_1: ${{ secrets.NAIXI_PASSWORD_1 || secrets.NAIXI_PASSWORD }}
