name: Daily Check-in & Unified Task Queue

run-name: >-
  checkin: ${{ inputs.retry == true && 'auto-retry(report)' || (github.event_name == 'workflow_dispatch' && (inputs.tasks != '' && inputs.tasks || 'manual') || (github.event_name == 'repository_dispatch' && github.event.action || 'scheduled')) }}

on:
  schedule:
    # 1. 晨间集中并发批次：北京时间 00:50（UTC 16:50，Actions 低谷期）执行 11 基础矩阵站点 + 2 WorkBuddy 账号
    - cron: "50 16 * * *"
    # 2. 魔粒奖励窗口批次：北京时间 09:10（UTC 01:10）执行 ModelScope 社区签到
    - cron: "10 1 * * *"
    # 3. Latvi 兜底锚点批次：北京时间 18:00（UTC 10:00）执行 Latvi 每日奖励及续期
    - cron: "0 10 * * *"
  repository_dispatch:
    types:
      - run_task
      - checkin_morning
      - checkin_modelscope
      - checkin_latvi
      - latvi_next_sign
      - workbuddy_travel_claim
  workflow_dispatch:
    inputs:
      tasks:
        description: '要执行的任务ID或脚本，逗号分隔（可选: all, matrix, workbuddy, glados, modelscope 等；留空按当前上下文默认）'
        required: false
        default: ''
        type: string
      retry:
        description: '标记为报告自动重跑（防循环；人工触发保持 false）'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read  # ai_router / latvi state 的 artifact 兜底恢复需读取历史 run 的 artifact

concurrency:
  group: checkin-${{ github.ref }}-${{ github.event_name }}-${{ github.event.action || github.event.schedule || inputs.tasks || 'manual' }}
  cancel-in-progress: false

jobs:
  select:
    name: Resolve Task Queue
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      task_count: ${{ steps.resolve.outputs.task_count }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve execution queue
        id: resolve
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          CRON_EXPR: ${{ github.event.schedule }}
          DISPATCH_TYPE: ${{ github.event.action }}
          INPUT_TASKS: ${{ inputs.tasks }}
        run: |
          python3 scripts/task_registry.py

  checkin-matrix:
    needs: select
    if: needs.select.outputs.task_count != '0'
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.select.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set TODAY
        run: echo "TODAY=$(TZ=Asia/Shanghai date +%Y-%m-%d)" >> "$GITHUB_ENV"

      # --- AI-ROUTER RTR 状态恢复 ---
      - name: Restore AI-ROUTER token rotation state
        id: ai_state
        if: matrix.script == 'ai_router.py'
        uses: actions/cache/restore@v4
        with:
          path: .ai_router_state.json
          key: ai-router-state-${{ github.run_id }}
          restore-keys: ai-router-state-

      - name: Restore AI-ROUTER state from artifact (fallback)
        if: matrix.script == 'ai_router.py' && steps.ai_state.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for rid in $(gh run list --workflow checkin.yml --status completed --limit 20 --json databaseId --jq '.[].databaseId'); do
            if gh run download "$rid" -n ai-router-state --dir . 2>/dev/null; then
              echo "✅ 已从 run $rid 的 artifact 恢复 AI-ROUTER state（cache 未命中兜底）"
              break
            fi
          done

      # --- Latvi 24h 冷却状态恢复 ---
      - name: Restore Latvi state
        if: matrix.script == 'latvi.py'
        uses: actions/cache/restore@v4
        with:
          path: .latvi_state.json
          key: latvi-state-${{ github.run_id }}
          restore-keys: latvi-state-

      # --- 核心任务执行（动态注入参数并毫秒级直写 Upstash Redis）---
      - name: Execute Check-in Task (${{ matrix.id }})
        env:
          TZ: Asia/Shanghai
          TASK_OUTPUT_DIR: .task_results
          TASK_RESULT_NAME: ${{ matrix.result }}
          TASK_TIMEOUT: ${{ matrix.timeout }}
          GITHUB_REPO: ${{ github.repository }}
          # === 基础设施凭证 ===
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          QSTASH_URL: ${{ secrets.QSTASH_URL }}
          QSTASH_TOKEN: ${{ secrets.QSTASH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          # === 站点凭证池 ===
          GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
          GLADOS_EXCHANGE_PLAN: ${{ secrets.GLADOS_EXCHANGE_PLAN }}
          GLADOS_AUTO_EXCHANGE: "true"
          GLADOS_DOMAINS: glados.cloud
          "2LIBRA_COOKIES": ${{ secrets.TWO_LIBRA_COOKIES }}
          BIANJIE_AI_ACCOUNTS: ${{ secrets.BIANJIE_AI_ACCOUNTS }}
          MOXING_username: ${{ secrets.MOXING_USERNAME }}
          MOXING_password: ${{ secrets.MOXING_PASSWORD }}
          MOXING_Domain: https://moxing.chat
          MOXING_UA: ${{ secrets.MOXING_UA }}
          UGNAS_cookie: ${{ secrets.UGNAS_COOKIE }}
          PCBETA_cookie: ${{ secrets.PCBETA_COOKIE }}
          PCBETA_username: ${{ secrets.PCBETA_USERNAME }}
          PCBETA_password: ${{ secrets.PCBETA_PASSWORD }}
          CLOUDSTUDIO_cookie: ${{ secrets.CLOUDSTUDIO_COOKIE }}
          CLOUDSTUDIO_xsrf: ${{ secrets.CLOUDSTUDIO_XSRF }}
          NAIXI_username: ${{ secrets.NAIXI_USERNAME }}
          NAIXI_PASSWORD: ${{ secrets.NAIXI_PASSWORD }}
          DJI_cookie: ${{ secrets.DJI_COOKIE }}
          MONKEYCODE_ACCOUNTS: ${{ secrets.MONKEYCODE_ACCOUNTS }}
          MONKEYCODE_cookie: ${{ secrets.MONKEYCODE_COOKIE }}
          MONKEYCODE_email: ${{ secrets.MONKEYCODE_EMAIL }}
          MONKEYCODE_password: ${{ secrets.MONKEYCODE_PASSWORD }}
          SOPHNET_TOKENS: ${{ secrets.SOPHNET_TOKENS }}
          AI_ROUTER_TOKEN: ${{ secrets.AI_ROUTER_TOKEN }}
          AI_ROUTER_REFRESH_TOKEN: ${{ secrets.AI_ROUTER_REFRESH_TOKEN }}
          AI_ROUTER_EMAIL: ${{ secrets.AI_ROUTER_EMAIL }}
          AI_ROUTER_USERNAME: ${{ secrets.AI_ROUTER_USERNAME }}
          AI_ROUTER_PASSWORD: ${{ secrets.AI_ROUTER_PASSWORD }}
          AI_ROUTER_COOKIE: ${{ secrets.AI_ROUTER_COOKIE }}
          AI_ROUTER_ACCOUNTS: ${{ secrets.AI_ROUTER_ACCOUNTS }}
          # WorkBuddy 动态账号适配
          WORKBUDDY_COOKIE: ${{ matrix.account == '2' && secrets.WORKBUDDY_COOKIE_2 || secrets.WORKBUDDY_COOKIE }}
          WORKBUDDY_WAIT_TRAVEL: "true"
          # ModelScope 双站凭证
          MODELSCOPE_cookie: ${{ secrets.MODELSCOPE_COOKIE }}
          MODELSCOPE_HOST: ${{ secrets.MODELSCOPE_HOST }}
          MODELSCOPE_AI_COOKIE: ${{ secrets.MODELSCOPE_AI_COOKIE }}
          # Latvi 凭证
          LATVI_EMAIL: ${{ secrets.LATVI_EMAIL }}
          LATVI_PASSWORD: ${{ secrets.LATVI_PASSWORD }}
          LATVI_STATE_FILE: .latvi_state.json
        run: |
          python3 scripts/run_task.py "scripts/${{ matrix.script }}"

      # --- 状态保存 ---
      - name: Save AI-ROUTER token rotation state
        if: always() && matrix.script == 'ai_router.py' && hashFiles('.ai_router_state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .ai_router_state.json
          key: ai-router-state-${{ github.run_id }}

      - name: Save Latvi state
        if: always() && matrix.script == 'latvi.py' && hashFiles('.latvi_state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .latvi_state.json
          key: latvi-state-${{ github.run_id }}

      # --- 冗余备份 Artifact ---
      - name: Upload task result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-result-${{ matrix.id }}
          path: .task_results/
          retention-days: 1
          include-hidden-files: true
