name: Daily Check-in & Unified Task Queue

run-name: >-
  checkin: ${{ inputs.retry == true && 'auto-retry(report)' || (github.event_name == 'workflow_dispatch' && (inputs.tasks != '' && inputs.tasks || 'manual') || (github.event_name == 'repository_dispatch' && github.event.action || 'scheduled')) }}

on:
  schedule:
    # 1. 晨间集中并发批次：北京时间 00:50（UTC 16:50，Actions 低谷期）执行 11 基础矩阵站点 + 2 WorkBuddy 账号
    - cron: "50 16 * * *"
    # 2. 魔粒奖励窗口批次：北京时间 09:10（UTC 01:10）执行 ModelScope 社区签到
    - cron: "10 1 * * *"
    # 3. Latvi 兜底锚点批次：北京时间 18:00（UTC 10:00）执行 Latvi 每日奖励及续期
    - cron: "0 10 * * *"
  repository_dispatch:
    types:
      - run_task
      - checkin_morning
      - checkin_modelscope
      - checkin_latvi
      - latvi_next_sign
      - workbuddy_travel_claim
  workflow_dispatch:
    inputs:
      tasks:
        description: '要执行的任务ID或脚本，逗号分隔（可选: all, matrix, workbuddy, glados, modelscope 等；留空按当前上下文默认）'
        required: false
        default: ''
        type: string
      retry:
        description: '标记为报告自动重跑（防循环；人工触发保持 false）'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read  # ai_router / latvi state 的 artifact 兜底恢复需读取历史 run 的 artifact

concurrency:
  group: checkin-${{ github.ref }}-${{ github.event_name }}-${{ github.event.action || github.event.schedule || inputs.tasks || 'manual' }}
  cancel-in-progress: false

jobs:
  select:
    name: Resolve Task Queue
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      task_count: ${{ steps.resolve.outputs.task_count }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Resolve execution queue
        id: resolve
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          CRON_EXPR: ${{ github.event.schedule }}
          DISPATCH_TYPE: ${{ github.event.action }}
          INPUT_TASKS: ${{ inputs.tasks }}
        run: |
          python3 scripts/task_registry.py

  checkin-matrix:
    needs: select
    if: needs.select.outputs.task_count != '0'
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.select.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set TODAY
        run: echo "TODAY=$(TZ=Asia/Shanghai date +%Y-%m-%d)" >> "$GITHUB_ENV"

      # --- AI-ROUTER RTR 状态恢复 ---
      - name: Restore AI-ROUTER token rotation state
        id: ai_state
        if: matrix.script == 'ai_router.py'
        uses: actions/cache/restore@v4
        with:
          path: .ai_router_state.json
          key: ai-router-state-${{ github.run_id }}
          restore-keys: ai-router-state-

      - name: Restore AI-ROUTER state from artifact (fallback)
        if: matrix.script == 'ai_router.py' && steps.ai_state.outputs.cache-hit != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for rid in $(gh run list --workflow checkin.yml --status completed --limit 20 --json databaseId --jq '.[].databaseId'); do
            if gh run download "$rid" -n ai-router-state --dir . 2>/dev/null; then
              echo "✅ 已从 run $rid 的 artifact 恢复 AI-ROUTER state（cache 未命中兜底）"
              break
            fi
          done

      # --- Latvi 24h 冷却状态恢复 ---
      - name: Restore Latvi state
        if: matrix.script == 'latvi.py'
        uses: actions/cache/restore@v4
        with:
          path: .latvi_state.json
          key: latvi-state-${{ github.run_id }}
          restore-keys: latvi-state-

      # --- AgentRouter 会话状态恢复 ---
      - name: Restore AgentRouter state
        if: matrix.script == 'agentrouter.py'
        uses: actions/cache/restore@v4
        with:
          path: .agentrouter_state.json
          key: agentrouter-state-${{ github.run_id }}
          restore-keys: agentrouter-state-

      # --- AgentRouter SS 代理出口（绕过 Aliyun WAF 滑块；仅 agentrouter 腿） ---
      - name: Setup SS proxy for AgentRouter
        if: matrix.script == 'agentrouter.py'
        run: |
          set -euo pipefail

          # 1. 下载静态编译 sslocal（shadowsocks-rust v1.23.4 musl；tarball 为扁平结构，二进制在根）
          curl -sL -o /tmp/ss.tar.xz \
            https://github.com/shadowsocks/shadowsocks-rust/releases/download/v1.23.4/shadowsocks-v1.23.4.x86_64-unknown-linux-musl.tar.xz
          tar xf /tmp/ss.tar.xz -C /tmp
          test -x /tmp/sslocal || { echo "❌ sslocal 二进制缺失"; exit 1; }

          # 2. 安装 obfs-local（simple-obfs，GLaDOS 等 obfs=tls 节点必需；apt 自动解析 libev/libcork 依赖）
          command -v obfs-local >/dev/null 2>&1 || \
            sudo apt-get install -y -qq simple-obfs >/dev/null 2>&1
          command -v obfs-local >/dev/null || { echo "❌ obfs-local 安装失败"; exit 1; }

          # 3. 写入 SS 配置（secret AGENTROUTER_SS_CONFIG，可直贴 GLaDOS/客户端导出原始 JSON）
          cat > /tmp/ss-config.json <<'EOF'
          ${{ secrets.AGENTROUTER_SS_CONFIG }}
          EOF
          test -s /tmp/ss-config.json || { echo "❌ AGENTROUTER_SS_CONFIG 未配置或为空"; exit 1; }

          # 3b. 归一化：sslocal 强制要求 local_address/local_port，缺失时补默认 127.0.0.1:1080；
          #      plugin 裸名 → 解析为绝对路径（防 PATH 查找失败，实测必须）
          python3 - <<'PY'
          import json, shutil, sys
          p = "/tmp/ss-config.json"
          try:
              cfg = json.load(open(p, encoding="utf-8"))
          except Exception as e:
              print(f"❌ AGENTROUTER_SS_CONFIG 不是合法 JSON: {e}")
              sys.exit(1)
          cfg["local_address"] = "127.0.0.1"
          cfg["local_port"] = 1080
          if cfg.get("plugin"):
              resolved = shutil.which(str(cfg["plugin"])) or str(cfg["plugin"])
              cfg["plugin"] = resolved
          json.dump(cfg, open(p, "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          PY

          # 4. 安装 pysocks（urllib 原生不支持 socks:// scheme，需 socket monkey-patch）
          pip install -q pysocks

          # 5. 后台启动 sslocal
          /tmp/sslocal -c /tmp/ss-config.json &
          SSPID=$!
          echo "SSPID=$SSPID" >> "$GITHUB_ENV"

          # 6. 等待 SOCKS5 端口就绪 + 功能校验（真实建连穿过节点，防「端口在听但隧道不通」）
          SSPORT=$(grep -oE '"local_port"[[:space:]]*:[[:space:]]*[0-9]+' /tmp/ss-config.json | grep -oE '[0-9]+$' || true)
          SSPORT=${SSPORT:-1080}
          echo "Waiting for SS proxy on port $SSPORT..."
          for i in $(seq 1 20); do
            if ss -tln 2>/dev/null | grep -q ":$SSPORT "; then
              break
            fi
            sleep 0.5
          done
          for i in 1 2 3; do
            if curl -sS -x "socks5://127.0.0.1:$SSPORT" -m 8 -o /dev/null https://api.ipify.org; then
              echo "✅ SS proxy ready (pid $SSPID, port $SSPORT)"
              exit 0
            fi
            sleep 1
          done
          echo "❌ SS proxy 启动失败（检查 AGENTROUTER_SS_CONFIG 的 server/server_port/password/method/plugin；或节点/出口 IP 已被封）"
          exit 1

      # --- 核心任务执行（动态注入参数并毫秒级直写 Upstash Redis）---
      - name: Execute Check-in Task (${{ matrix.id }})
        env:
          TZ: Asia/Shanghai
          TASK_OUTPUT_DIR: .task_results
          TASK_RESULT_NAME: ${{ matrix.result }}
          TASK_TIMEOUT: ${{ matrix.timeout }}
          GITHUB_REPO: ${{ github.repository }}
          # === 基础设施凭证 ===
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          QSTASH_URL: ${{ secrets.QSTASH_URL }}
          QSTASH_TOKEN: ${{ secrets.QSTASH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          # === 站点凭证池 ===
          GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
          GLADOS_EXCHANGE_PLAN: ${{ secrets.GLADOS_EXCHANGE_PLAN }}
          GLADOS_AUTO_EXCHANGE: "true"
          GLADOS_DOMAINS: glados.cloud
          "2LIBRA_COOKIES": ${{ secrets.TWO_LIBRA_COOKIES }}
          BIANJIE_AI_ACCOUNTS: ${{ secrets.BIANJIE_AI_ACCOUNTS }}
          MOXING_username: ${{ secrets.MOXING_USERNAME }}
          MOXING_password: ${{ secrets.MOXING_PASSWORD }}
          MOXING_Domain: https://moxing.chat
          MOXING_UA: ${{ secrets.MOXING_UA }}
          UGNAS_cookie: ${{ secrets.UGNAS_COOKIE }}
          PCBETA_cookie: ${{ secrets.PCBETA_COOKIE }}
          PCBETA_username: ${{ secrets.PCBETA_USERNAME }}
          PCBETA_password: ${{ secrets.PCBETA_PASSWORD }}
          CLOUDSTUDIO_cookie: ${{ secrets.CLOUDSTUDIO_COOKIE }}
          CLOUDSTUDIO_xsrf: ${{ secrets.CLOUDSTUDIO_XSRF }}
          NAIXI_username: ${{ secrets.NAIXI_USERNAME }}
          NAIXI_PASSWORD: ${{ secrets.NAIXI_PASSWORD }}
          DJI_cookie: ${{ secrets.DJI_COOKIE }}
          MONKEYCODE_ACCOUNTS: ${{ secrets.MONKEYCODE_ACCOUNTS }}
          MONKEYCODE_cookie: ${{ secrets.MONKEYCODE_COOKIE }}
          MONKEYCODE_email: ${{ secrets.MONKEYCODE_EMAIL }}
          MONKEYCODE_password: ${{ secrets.MONKEYCODE_PASSWORD }}
          SOPHNET_TOKENS: ${{ secrets.SOPHNET_TOKENS }}
          AI_ROUTER_TOKEN: ${{ secrets.AI_ROUTER_TOKEN }}
          AI_ROUTER_REFRESH_TOKEN: ${{ secrets.AI_ROUTER_REFRESH_TOKEN }}
          AI_ROUTER_EMAIL: ${{ secrets.AI_ROUTER_EMAIL }}
          AI_ROUTER_USERNAME: ${{ secrets.AI_ROUTER_USERNAME }}
          AI_ROUTER_PASSWORD: ${{ secrets.AI_ROUTER_PASSWORD }}
          AI_ROUTER_COOKIE: ${{ secrets.AI_ROUTER_COOKIE }}
          AI_ROUTER_ACCOUNTS: ${{ secrets.AI_ROUTER_ACCOUNTS }}
          # AgentRouter（New API 面板，签到=登录，邮箱密码必填）
          AGENTROUTER_EMAIL: ${{ secrets.AGENTROUTER_EMAIL }}
          AGENTROUTER_PASSWORD: ${{ secrets.AGENTROUTER_PASSWORD }}
          AGENTROUTER_ACCOUNTS: ${{ secrets.AGENTROUTER_ACCOUNTS }}
          AGENTROUTER_API_URL: https://ps.air-outer.com
          AGENTROUTER_STATE_FILE: .agentrouter_state.json
          # SOCKS5 出口仅 agentrouter 腿生效（proxy 由 Setup SS proxy 步骤启动）
          AGENTROUTER_PROXY: ${{ matrix.script == 'agentrouter.py' && 'socks5://127.0.0.1:1080' || '' }}
          # WorkBuddy 动态账号适配
          WORKBUDDY_COOKIE: ${{ matrix.account == '2' && secrets.WORKBUDDY_COOKIE_2 || secrets.WORKBUDDY_COOKIE }}
          WORKBUDDY_WAIT_TRAVEL: "true"
          # ModelScope 双站凭证
          MODELSCOPE_cookie: ${{ secrets.MODELSCOPE_COOKIE }}
          MODELSCOPE_HOST: ${{ secrets.MODELSCOPE_HOST }}
          MODELSCOPE_AI_COOKIE: ${{ secrets.MODELSCOPE_AI_COOKIE }}
          # Latvi 凭证
          LATVI_EMAIL: ${{ secrets.LATVI_EMAIL }}
          LATVI_PASSWORD: ${{ secrets.LATVI_PASSWORD }}
          LATVI_STATE_FILE: .latvi_state.json
        run: |
          python3 scripts/run_task.py "scripts/${{ matrix.script }}"

      # --- 状态保存 ---
      - name: Save AI-ROUTER token rotation state
        if: always() && matrix.script == 'ai_router.py' && hashFiles('.ai_router_state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .ai_router_state.json
          key: ai-router-state-${{ github.run_id }}

      - name: Save Latvi state
        if: always() && matrix.script == 'latvi.py' && hashFiles('.latvi_state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .latvi_state.json
          key: latvi-state-${{ github.run_id }}

      - name: Save AgentRouter state
        if: always() && matrix.script == 'agentrouter.py' && hashFiles('.agentrouter_state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .agentrouter_state.json
          key: agentrouter-state-${{ github.run_id }}

      - name: Cleanup SS proxy
        if: always() && matrix.script == 'agentrouter.py'
        run: |
          kill "${SSPID:-}" 2>/dev/null || true
          pkill -f '[s]slocal' 2>/dev/null || true

      # --- 冗余备份 Artifact ---
      - name: Upload task result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-result-${{ matrix.id }}
          path: .task_results/
          retention-days: 1
          include-hidden-files: true
