name: Daily Check-in & Unified Task Queue

run-name: >-
  checkin: ${{ inputs.retry == true && 'auto-retry(report)' || (github.event_name == 'workflow_dispatch' && (inputs.tasks != '' && inputs.tasks || 'manual') || (github.event_name == 'repository_dispatch' && github.event.action || 'scheduled')) }}

on:
  schedule:
    # 主流水线：北京时间 14:00（UTC 06:00）单 run 全内联（稳态 ~18:1x 结束，硬墙 19:55（ORCH_HARD_DEADLINE））
    - cron: "0 6 * * *"
    # 报告兜底：北京时间 20:30（UTC 12:30，晚于硬墙 19:55（ORCH_HARD_DEADLINE）），仅走报告分支
    - cron: "30 12 * * *"
  repository_dispatch:
    types:
      - checkin_morning
      - checkin_modelscope
      - checkin_latvi
      - latvi_next_sign
      - workbuddy_travel_claim
      - daily_report
  workflow_dispatch:
    inputs:
      tasks:
        description: '要执行的任务ID或脚本，逗号分隔（可选: all, matrix, workbuddy, glados, modelscope 等；留空按当日时间线默认）'
        required: false
        default: ''
        type: string
      retry:
        description: '标记为报告自动重跑（防循环；人工触发保持 false）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

# ============================================================
# Job 1 — 统一编排主流水线（14:00 主 cron / 手动 / 旧接力兼容）
# ============================================================
jobs:
  unified:
    if: >-
      ${{ !(github.event_name == 'schedule' && github.event.schedule == '30 12 * * *')
          && github.event.action != 'daily_report' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: unified-${{ github.ref }}
      cancel-in-progress: false
    env:
      TZ: Asia/Shanghai
      TASK_OUTPUT_DIR: .task_results
      GITHUB_REPO: ${{ github.repository }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      QSTASH_URL: ${{ secrets.QSTASH_URL }}
      QSTASH_TOKEN: ${{ secrets.QSTASH_TOKEN }}
      GH_PAT: ${{ secrets.GH_PAT }}
      GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
      GLADOS_COOKIE_1: ${{ secrets.GLADOS_COOKIE_1 || secrets.GLADOS_COOKIES }}
      GLADOS_COOKIE_2: ${{ secrets.GLADOS_COOKIE_2 }}
      GLADOS_COOKIE_3: ${{ secrets.GLADOS_COOKIE_3 }}
      GLADOS_ACCOUNTS: ${{ secrets.GLADOS_ACCOUNTS }}
      GLADOS_ACCOUNT_1: ${{ secrets.GLADOS_ACCOUNT_1 || secrets.GLADOS_ACCOUNTS }}
      GLADOS_ACCOUNT_2: ${{ secrets.GLADOS_ACCOUNT_2 }}
      GLADOS_EXCHANGE_PLAN: ${{ secrets.GLADOS_EXCHANGE_PLAN }}
      GLADOS_AUTO_EXCHANGE: "true"
      GLADOS_DOMAINS: glados.cloud
      "2LIBRA_COOKIES": ${{ secrets.TWO_LIBRA_COOKIES }}
      "2LIBRA_COOKIE_1": ${{ secrets.TWO_LIBRA_COOKIE_1 || secrets.TWO_LIBRA_COOKIES }}
      "2LIBRA_COOKIE_2": ${{ secrets.TWO_LIBRA_COOKIE_2 }}
      "2LIBRA_COOKIE_3": ${{ secrets.TWO_LIBRA_COOKIE_3 }}
      BIANJIE_AI_ACCOUNTS: ${{ secrets.BIANJIE_AI_ACCOUNTS }}
      BIANJIE_AI_USERNAME_1: ${{ secrets.BIANJIE_AI_USERNAME_1 || secrets.BIANJIE_AI_USERNAME }}
      BIANJIE_AI_PASSWORD_1: ${{ secrets.BIANJIE_AI_PASSWORD_1 || secrets.BIANJIE_AI_PASSWORD }}
      BIANJIE_AI_USERNAME_2: ${{ secrets.BIANJIE_AI_USERNAME_2 }}
      BIANJIE_AI_PASSWORD_2: ${{ secrets.BIANJIE_AI_PASSWORD_2 }}
      MOXING_username: ${{ secrets.MOXING_USERNAME_1 || secrets.MOXING_USERNAME }}
      MOXING_password: ${{ secrets.MOXING_PASSWORD_1 || secrets.MOXING_PASSWORD }}
      MOXING_USERNAME_1: ${{ secrets.MOXING_USERNAME_1 || secrets.MOXING_USERNAME }}
      MOXING_PASSWORD_1: ${{ secrets.MOXING_PASSWORD_1 || secrets.MOXING_PASSWORD }}
