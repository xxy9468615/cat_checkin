      CLOUDSTUDIO_cookie: ${{ secrets.CLOUDSTUDIO_COOKIE_1 || secrets.CLOUDSTUDIO_COOKIE }}
      CLOUDSTUDIO_COOKIE_1: ${{ secrets.CLOUDSTUDIO_COOKIE_1 || secrets.CLOUDSTUDIO_COOKIE }}
