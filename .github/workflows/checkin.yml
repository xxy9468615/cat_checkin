name: Daily Check-in & Unified Task Queue

run-name: >-
  checkin: ${{ inputs.retry == true && 'auto-retry(report)' || (github.event_name == 'workflow_dispatch' && (inputs.tasks != '' && inputs.tasks || 'manual') || (github.event_name == 'repository_dispatch' && github.event.action || 'scheduled')) }}

on:
  schedule:
    # 主流水线：北京时间 14:00（UTC 06:00）单 run 全内联（稳态 ~18:1x 结束，硬墙 19:55（ORCH_HARD_DEADLINE））
    - cron: "0 6 * * *"
    # 心跳轮询：每 4h 一次，跑滚动冷却型任务（modelscope 双实例，DUE_ONLY 按
    # last_credit_ts 状态决定是否执行；未到期秒级跳过）+ CloudStudio SSO 保活触碰
    # （KEYCLOAK 服务端会话是闲置寿命，每日一次续票追不上窗口导致 8/30 整点失效；
    #  每 4h 触碰一次刷新闲置计时，registry 无 sched 元数据 → DUE_ONLY 恒视为到期）
    - cron: "0 */4 * * *"
    # 报告兜底：北京时间 20:30（UTC 12:30，晚于硬墙 19:55（ORCH_HARD_DEADLINE）），仅走报告分支
    - cron: "30 12 * * *"
  repository_dispatch:
    types:
      - checkin_morning
      - checkin_modelscope
      - checkin_latvi
      - latvi_next_sign
      - workbuddy_travel_claim
      - daily_report
      - checkin_retry
  workflow_dispatch:
    inputs:
      tasks:
        description: '要执行的任务ID或脚本，逗号分隔（可选: all, matrix, workbuddy, glados, modelscope 等；留空按当日时间线默认）'
        required: false
        default: ''
        type: string
      reset_circuit:
        description: '重置并重新上线处于熔断状态的任务（等待修复后上线时勾选）'
        required: false
        default: false
        type: boolean
      retry:
        description: '标记为报告自动重跑（防循环；人工触发保持 false）'
        required: false
        default: false
        type: boolean
      due_only:
        description: '心跳模拟：仅滚动冷却任务 + 到期过滤 + 仅归档（不发邮件）'
        required: false
        default: false
        type: boolean
      direct:
        description: '诊断：跳过 SS/代理，任务用 runner 自身 IP 直连（nodeseek 排查用）'
        required: false
        default: false
        type: boolean
      no_cffi:
        description: '诊断：nodeseek 强制 urllib/HTTP1.1（禁用 curl_cffi chrome 指纹）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: write

# ============================================================
# Job 1 — 统一编排主流水线（14:00 主 cron / 手动 / 旧接力兼容）
# ============================================================
jobs:
