      MONKEYCODE_password: ${{ secrets.MONKEY_CODE_PASSWORD_1 || secrets.MONKEYCODE_PASSWORD_1 || secrets.MONKEY_CODE_PASSWORD || secrets.MONKEYCODE_PASSWORD }}
      MONKEYCODE_EMAIL_1: ${{ secrets.MONKEY_CODE_EMAIL_1 || secrets.MONKEYCODE_EMAIL_1 || secrets.MONKEY_CODE_EMAIL || secrets.MONKEYCODE_EMAIL }}
      MONKEYCODE_PASSWORD_1: ${{ secrets.MONKEY_CODE_PASSWORD_1 || secrets.MONKEYCODE_PASSWORD_1 || secrets.MONKEY_CODE_PASSWORD || secrets.MONKEYCODE_PASSWORD }}
      MONKEYCODE_EMAIL_2: ${{ secrets.MONKEY_CODE_EMAIL_2 || secrets.MONKEYCODE_EMAIL_2 }}
      MONKEYCODE_PASSWORD_2: ${{ secrets.MONKEY_CODE_PASSWORD_2 || secrets.MONKEYCODE_PASSWORD_2 }}
      MONKEYCODE_EMAIL_3: ${{ secrets.MONKEY_CODE_EMAIL_3 || secrets.MONKEYCODE_EMAIL_3 }}
      MONKEYCODE_PASSWORD_3: ${{ secrets.MONKEY_CODE_PASSWORD_3 || secrets.MONKEYCODE_PASSWORD_3 }}
      SOPHNET_TOKENS: ${{ secrets.SOPHNET_TOKENS }}
      SOPHNET_TOKEN_1: ${{ secrets.SOPHNET_TOKEN_1 || secrets.SOPHNET_TOKEN }}
      SOPHNET_REFRESH_TOKEN_1: ${{ secrets.SOPHNET_REFRESH_TOKEN_1 || secrets.SOPHNET_REFRESH_TOKEN }}
      SOPHNET_TOKEN_2: ${{ secrets.SOPHNET_TOKEN_2 }}
      SOPHNET_REFRESH_TOKEN_2: ${{ secrets.SOPHNET_REFRESH_TOKEN_2 }}
      AI_ROUTER_TOKEN: ${{ secrets.AI_ROUTER_TOKEN }}
      AI_ROUTER_REFRESH_TOKEN: ${{ secrets.AI_ROUTER_REFRESH_TOKEN }}
      AI_ROUTER_TOKEN_1: ${{ secrets.AI_ROUTER_TOKEN_1 || secrets.AI_ROUTER_TOKEN }}
      AI_ROUTER_REFRESH_TOKEN_1: ${{ secrets.AI_ROUTER_REFRESH_TOKEN_1 || secrets.AI_ROUTER_REFRESH_TOKEN }}
      AI_ROUTER_EMAIL: ${{ secrets.AI_ROUTER_EMAIL }}
      AI_ROUTER_USERNAME: ${{ secrets.AI_ROUTER_USERNAME }}
      AI_ROUTER_PASSWORD: ${{ secrets.AI_ROUTER_PASSWORD }}
      AI_ROUTER_EMAIL_1: ${{ secrets.AI_ROUTER_EMAIL_1 || secrets.AI_ROUTER_EMAIL || secrets.AI_ROUTER_USERNAME }}
      AI_ROUTER_PASSWORD_1: ${{ secrets.AI_ROUTER_PASSWORD_1 || secrets.AI_ROUTER_PASSWORD }}
      AI_ROUTER_EMAIL_2: ${{ secrets.AI_ROUTER_EMAIL_2 }}
      AI_ROUTER_PASSWORD_2: ${{ secrets.AI_ROUTER_PASSWORD_2 }}
      AI_ROUTER_COOKIE: ${{ secrets.AI_ROUTER_COOKIE }}
      AI_ROUTER_COOKIE_1: ${{ secrets.AI_ROUTER_COOKIE_1 || secrets.AI_ROUTER_COOKIE }}
      AI_ROUTER_COOKIE_2: ${{ secrets.AI_ROUTER_COOKIE_2 }}
      AI_ROUTER_ACCOUNTS: ${{ secrets.AI_ROUTER_ACCOUNTS }}
      AGENTROUTER_EMAIL: ${{ secrets.AGENTROUTER_EMAIL }}
      AGENTROUTER_PASSWORD: ${{ secrets.AGENTROUTER_PASSWORD }}
      AGENTROUTER_EMAIL_1: ${{ secrets.AGENTROUTER_EMAIL_1 || secrets.AGENTROUTER_EMAIL }}
      AGENTROUTER_PASSWORD_1: ${{ secrets.AGENTROUTER_PASSWORD_1 || secrets.AGENTROUTER_PASSWORD }}
      AGENTROUTER_EMAIL_2: ${{ secrets.AGENTROUTER_EMAIL_2 }}
      AGENTROUTER_PASSWORD_2: ${{ secrets.AGENTROUTER_PASSWORD_2 }}
      AGENTROUTER_ACCOUNTS: ${{ secrets.AGENTROUTER_ACCOUNTS }}
      AGENTROUTER_API_URL: https://ps.air-outer.com
      AGENTROUTER_STATE_FILE: .agentrouter_state.json
      AGENTROUTER_PROXY: socks5://127.0.0.1:1080
      U1S1_TOKEN: ${{ secrets.U1S1_TOKEN }}
      U1S1_TOKEN_1: ${{ secrets.U1S1_TOKEN_1 || secrets.U1S1_TOKEN }}
      U1S1_TOKEN_2: ${{ secrets.U1S1_TOKEN_2 }}
      U1S1_COOKIE: ${{ secrets.U1S1_COOKIE }}
      U1S1_COOKIE_1: ${{ secrets.U1S1_COOKIE_1 || secrets.U1S1_COOKIE }}
      U1S1_COOKIE_2: ${{ secrets.U1S1_COOKIE_2 }}
      WORKBUDDY_COOKIE: ${{ secrets.WORKBUDDY_COOKIE }}
      WORKBUDDY_COOKIE_1: ${{ secrets.WORKBUDDY_COOKIE_1 || secrets.WORKBUDDY_COOKIE }}
      WORKBUDDY_COOKIE_2: ${{ secrets.WORKBUDDY_COOKIE_2 }}
      WORKBUDDY_COOKIE_3: ${{ secrets.WORKBUDDY_COOKIE_3 }}
      WORKBUDDY_WAIT_TRAVEL: "true"
      MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN_1 || secrets.MODELSCOPE_TOKEN || secrets.MODELSCOPE_API_TOKEN || secrets.MODELSCOPE_ACCESS_TOKEN }}
      MODELSCOPE_TOKEN_1: ${{ secrets.MODELSCOPE_TOKEN_1 || secrets.MODELSCOPE_TOKEN || secrets.MODELSCOPE_API_TOKEN || secrets.MODELSCOPE_ACCESS_TOKEN }}
      MODELSCOPE_TOKEN_2: ${{ secrets.MODELSCOPE_TOKEN_2 }}
      MODELSCOPE_TOKEN_3: ${{ secrets.MODELSCOPE_TOKEN_3 }}
      MODELSCOPE_TOKEN_4: ${{ secrets.MODELSCOPE_TOKEN_4 }}
      MODELSCOPE_TOKEN_5: ${{ secrets.MODELSCOPE_TOKEN_5 }}
      MODELSCOPE_API_TOKEN: ${{ secrets.MODELSCOPE_API_TOKEN || secrets.MODELSCOPE_TOKEN }}
      MODELSCOPE_cookie: ${{ secrets.MODELSCOPE_COOKIE_1 || secrets.MODELSCOPE_COOKIE }}
      MODELSCOPE_COOKIE_1: ${{ secrets.MODELSCOPE_COOKIE_1 || secrets.MODELSCOPE_COOKIE }}
      MODELSCOPE_COOKIE_2: ${{ secrets.MODELSCOPE_COOKIE_2 }}
      MODELSCOPE_COOKIE_3: ${{ secrets.MODELSCOPE_COOKIE_3 }}
      MODELSCOPE_COOKIE_4: ${{ secrets.MODELSCOPE_COOKIE_4 }}
      MODELSCOPE_COOKIE_5: ${{ secrets.MODELSCOPE_COOKIE_5 }}
      MODELSCOPE_HOST: ${{ secrets.MODELSCOPE_HOST }}
      MODELSCOPE_PROXY: ${{ secrets.MODELSCOPE_PROXY }}
      MODELSCOPE_AI_TOKEN: ${{ secrets.MODELSCOPE_AI_TOKEN_1 || secrets.MODELSCOPE_AI_TOKEN }}
      MODELSCOPE_AI_TOKEN_1: ${{ secrets.MODELSCOPE_AI_TOKEN_1 || secrets.MODELSCOPE_AI_TOKEN }}
      MODELSCOPE_AI_TOKEN_2: ${{ secrets.MODELSCOPE_AI_TOKEN_2 }}
      MODELSCOPE_AI_TOKEN_3: ${{ secrets.MODELSCOPE_AI_TOKEN_3 }}
      MODELSCOPE_AI_TOKEN_4: ${{ secrets.MODELSCOPE_AI_TOKEN_4 }}
      MODELSCOPE_AI_TOKEN_5: ${{ secrets.MODELSCOPE_AI_TOKEN_5 }}
      MODELSCOPE_AI_COOKIE: ${{ secrets.MODELSCOPE_AI_COOKIE_1 || secrets.MODELSCOPE_AI_COOKIE }}
      MODELSCOPE_AI_COOKIE_1: ${{ secrets.MODELSCOPE_AI_COOKIE_1 || secrets.MODELSCOPE_AI_COOKIE }}
      MODELSCOPE_AI_COOKIE_2: ${{ secrets.MODELSCOPE_AI_COOKIE_2 }}
      MODELSCOPE_AI_COOKIE_3: ${{ secrets.MODELSCOPE_AI_COOKIE_3 }}
      MODELSCOPE_AI_COOKIE_4: ${{ secrets.MODELSCOPE_AI_COOKIE_4 }}
      MODELSCOPE_AI_COOKIE_5: ${{ secrets.MODELSCOPE_AI_COOKIE_5 }}
      LATVI_EMAIL: ${{ secrets.LATVI_EMAIL_1 || secrets.LATVI_EMAIL }}
      LATVI_PASSWORD: ${{ secrets.LATVI_PASSWORD_1 || secrets.LATVI_PASSWORD }}
      LATVI_EMAIL_1: ${{ secrets.LATVI_EMAIL_1 || secrets.LATVI_EMAIL }}
      LATVI_PASSWORD_1: ${{ secrets.LATVI_PASSWORD_1 || secrets.LATVI_PASSWORD }}
      LATVI_STATE_FILE: .latvi_state.json
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      DISCORD_REPORT_WEBHOOK_URL: ${{ secrets.DISCORD_REPORT_WEBHOOK_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM: ${{ secrets.RESEND_FROM }}
      RESEND_TO: ${{ secrets.RESEND_TO }}
      MAIL_HOST: ${{ secrets.MAIL_HOST }}
      MAIL_PORT: ${{ secrets.MAIL_PORT }}
      MAIL_USER: ${{ secrets.MAIL_USER }}
      MAIL_PASS: ${{ secrets.MAIL_PASS }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      MAIL_TO: ${{ secrets.MAIL_TO }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set TODAY
        run: echo "TODAY=$(TZ=Asia/Shanghai date +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Restore unified states
        uses: actions/cache/restore@v4
        with:
          path: |
            .ai_router_state.json
            .latvi_state.json
            .agentrouter_state.json
            .cloudstudio_state*.json
            .modelscope_*.json
            .notify_state_*.json
          key: unified-states-${{ github.run_id }}
          restore-keys: |
            unified-states-
            ai-router-state-
            latvi-state-
            agentrouter-state-

      - name: Setup SS proxy for AgentRouter
        env:
          AGENTROUTER_SS_CONFIG: ${{ secrets.AGENTROUTER_SS_CONFIG }}
          AGENTROUTER_SS_SHA256: ${{ secrets.AGENTROUTER_SS_SHA256 }}
          AGENTROUTER_BACKUP_PROXIES: ${{ secrets.AGENTROUTER_BACKUP_PROXIES }}
        run: |
          set -euo pipefail
          # 可选组件全程软失败：主 SS 出口与备用代理全部不可用时只让 agentrouter
          # 红卡（公平失败），不能杀死整条主流水线让 16 个签到任务全部不跑。
          # AGENTROUTER_BACKUP_PROXIES：每行一条 socks5:// 或 http(s):// 代理，
          # 支持 user:pass@host:port 与行内 # 注释；仅在本地 sslocal 不可用时
          # 按序探测，取第一条能通 AgentRouter API 的，经 GITHUB_ENV 覆盖 job 级
          # 默认 AGENTROUTER_PROXY=socks5://127.0.0.1:1080。
          setup_ss() {
            curl -sL --max-time 60 -o /tmp/ss.tar.xz \
              https://github.com/shadowsocks/shadowsocks-rust/releases/download/v1.23.4/shadowsocks-v1.23.4.x86_64-unknown-linux-musl.tar.xz \
              || { echo "sslocal download failed"; return 1; }
            # 供应链校验：配置了 AGENTROUTER_SS_SHA256 secret 时强制核对（未配置则跳过）
            if [ -n "$AGENTROUTER_SS_SHA256" ]; then
              echo "$AGENTROUTER_SS_SHA256  /tmp/ss.tar.xz" | sha256sum -c - \
                || { echo "sslocal checksum MISMATCH"; return 1; }
            fi
            tar xf /tmp/ss.tar.xz -C /tmp
            test -x /tmp/sslocal || { echo "sslocal missing"; return 1; }
            if ! command -v obfs-local >/dev/null 2>&1; then
              sudo apt-get install -y -qq simple-obfs >/dev/null 2>&1 \
                || echo "obfs-local install failed; SS proxy may not work with obfs nodes"
            fi
            # printf 而非 heredoc：quoted heredoc 不展开变量，且 secret 中的反斜杠/引号可原样落盘
            printf '%s' "$AGENTROUTER_SS_CONFIG" > /tmp/ss-config.json
            test -s /tmp/ss-config.json || { echo "AGENTROUTER_SS_CONFIG empty"; return 1; }
            python3 - <<'PY' || return 1
          import json, shutil, sys
          p = "/tmp/ss-config.json"
          try:
              cfg = json.load(open(p, encoding="utf-8"))
          except Exception as e:
              print(f"AGENTROUTER_SS_CONFIG not valid JSON: {e}")
              sys.exit(1)
          cfg["local_address"] = "127.0.0.1"
          cfg["local_port"] = 1080
          if cfg.get("plugin"):
              resolved = shutil.which(str(cfg["plugin"])) or str(cfg["plugin"])
              cfg["plugin"] = resolved
          json.dump(cfg, open(p, "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          PY
            pip install -q pysocks || { echo "pysocks install failed"; return 1; }
            /tmp/sslocal -c /tmp/ss-config.json &
            SSPID=$!
            echo "SSPID=$SSPID" >> "$GITHUB_ENV"
            SSPORT=1080
            echo "Waiting for SS proxy on port $SSPORT..."
            for i in $(seq 1 20); do
              if ss -tln 2>/dev/null | grep -q ":$SSPORT "; then
                break
              fi
              sleep 0.5
            done
            for i in 1 2 3; do
              if curl -sS -x "socks5://127.0.0.1:$SSPORT" -m 8 -o /dev/null https://api.ipify.org; then
                echo "SS proxy ready (pid $SSPID, port $SSPORT)"
                return 0
              fi
              sleep 1
            done
            echo "SS proxy failed (check AGENTROUTER_SS_CONFIG)"
            return 1
          }

          if setup_ss; then
            exit 0
          fi

          echo "SS proxy unavailable; trying backup proxies..."
          while IFS= read -r line; do
            p="${line%%#*}"
            p="$(printf '%s' "$p" | tr -d '[:space:]')"
            [ -n "$p" ] || continue
            if curl -sS -x "$p" -m 12 -o /dev/null https://ps.air-outer.com; then
              echo "AGENTROUTER_PROXY=$p" >> "$GITHUB_ENV"
              echo "backup proxy OK: ${p##*@}"
              exit 0
            fi
            echo "backup proxy unreachable: ${p##*@}"
          done <<< "$AGENTROUTER_BACKUP_PROXIES"
          echo "no backup proxy available; agentrouter will fail (red card by design)"

      - name: Resolve dispatch compat -> ORCH_TASKS
        id: orch_tasks
        env:
          # 输入经 env 间接传递，避免 ${{ }} 直接内插 shell（引号/命令注入面）
          INPUT_TASKS: ${{ inputs.tasks }}
          EVENT_ACTION: ${{ github.event.action }}
        run: |
          # workflow_dispatch explicit tasks take precedence
          if [ -n "$INPUT_TASKS" ]; then
            echo "tasks=$INPUT_TASKS" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$EVENT_ACTION" in
            latvi_next_sign|checkin_latvi) echo "tasks=latvi" >> "$GITHUB_OUTPUT" ;;
            workbuddy_travel_claim)        echo "tasks=workbuddy" >> "$GITHUB_OUTPUT" ;;
            checkin_modelscope)            echo "tasks=modelscope" >> "$GITHUB_OUTPUT" ;;
            checkin_morning)               echo "tasks=matrix,workbuddy" >> "$GITHUB_OUTPUT" ;;
            *) echo "tasks=" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Execute daily orchestrator
        id: orchestrator
        env:
          ORCH_TASKS: ${{ steps.orch_tasks.outputs.tasks }}
          # 重跑 run（retry=true）结束后补推一条 [重跑] 前缀的每日日报
          RETRY_REPORT: ${{ inputs.retry == true && '1' || '0' }}
        run: |
          if [ -n "$ORCH_TASKS" ]; then
            python3 scripts/daily_orchestrator.py --tasks "$ORCH_TASKS"
          else
            python3 scripts/daily_orchestrator.py
          fi

      - name: Send unified report
        id: send_report
        if: >-
          always()
          && !(github.event_name == 'repository_dispatch'
               && contains(fromJSON('["latvi_next_sign","checkin_latvi","checkin_morning","checkin_modelscope","workbuddy_travel_claim"]'), github.event.action))
        env:
          DAILY_PUSH: "true"
          # 重跑 run 发送「[重跑]」补充邮件（不写当日 marker、不再触发递归重试）
          RETRY_REPORT: ${{ inputs.retry == true && '1' || '0' }}
        run: python3 scripts/unified_report.py

      - name: Auto-retry failed sites
        if: >-
          always() && steps.send_report.outputs.failed_matrix != ''
          && !(github.event_name == 'repository_dispatch'
               && contains(fromJSON('["latvi_next_sign","checkin_latvi","checkin_morning","checkin_modelscope","workbuddy_travel_claim"]'), github.event.action))
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          FAILED_MATRIX: ${{ steps.send_report.outputs.failed_matrix }}
        run: |
          set -uo pipefail
          RETRIED=$(python3 - <<'EOF'
          import datetime as dt, json, subprocess
          tz = dt.timezone(dt.timedelta(hours=8))
          today = dt.datetime.now(tz).strftime("%Y-%m-%d")
          try:
              out = subprocess.check_output(
                  ["gh", "run", "list", "--workflow", "checkin.yml", "--event", "workflow_dispatch",
                   "--limit", "10", "--json", "createdAt"], text=True)
              runs = json.loads(out)
          except Exception:
              print("unknown", flush=True)
          else:
              hit = any(
                  dt.datetime.fromisoformat(r["createdAt"].replace("Z", "+00:00"))
                  .astimezone(tz).strftime("%Y-%m-%d") == today
                  for r in runs)
              print("true" if hit else "false", flush=True)
          EOF
          )
          if [ "$RETRIED" != "false" ]; then
            echo "Today already has a workflow_dispatch checkin run ($RETRIED), skip auto-retry"
            exit 0
          fi
          echo "Auto-retry failed sites: $FAILED_MATRIX"
          if gh workflow run checkin.yml --ref "${GITHUB_REF_NAME:-main}" -f tasks="$FAILED_MATRIX" -f retry=true; then
            echo "Retry dispatched"
          else
            echo "Retry dispatch failed, please check manually"
          fi

      - name: Save unified states
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .ai_router_state.json
            .latvi_state.json
            .agentrouter_state.json
            .cloudstudio_state*.json
            .modelscope_*.json
            .notify_state_*.json
          key: unified-states-${{ github.run_id }}

      - name: Cleanup SS proxy
        if: always()
        run: |
          kill "${SSPID:-}" 2>/dev/null || true
          pkill -f '[s]slocal' 2>/dev/null || true

      - name: Upload unified results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unified-results
          path: .task_results/
          retention-days: 1
          include-hidden-files: true

  # ============================================================
  # Job 2 — 报告兜底（20:30 晚于硬墙，仅当主 run 未发报告时补发）
  # ============================================================
  report-fallback:
    if: >-
      ${{ github.event_name == 'schedule' && github.event.schedule == '30 12 * * *'
          || github.event.action == 'daily_report' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: report-fallback-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Syntax check
        run: python3 -m py_compile scripts/*.py

      - name: Set TODAY
        run: echo "TODAY=$(TZ=Asia/Shanghai date +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Check if report sent today (Redis marker)
        id: check_sent
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          TODAY: ${{ env.TODAY }}
        run: |
          python3 <<'EOF'
          import os, json, sys, urllib.request
          url = (os.getenv("UPSTASH_REDIS_REST_URL") or "").rstrip("/")
          token = os.getenv("UPSTASH_REDIS_REST_TOKEN") or ""
          today = os.getenv("TODAY", "")
          gh_output = os.getenv("GITHUB_OUTPUT")
          prefix = (os.getenv("CAT_CHECKIN_REDIS_PREFIX") or "cat_checkin:").rstrip(":")
          marker_key = f"{prefix}:sent:{today}"
          if not url or not token:
              if gh_output:
                  open(gh_output, "a", encoding="utf-8").write("sent=false\n")
              sys.exit(0)
          req = urllib.request.Request(f"{url}/get/{marker_key}", headers={"Authorization": f"Bearer {token}", "Accept": "application/json"})
          try:
              with urllib.request.urlopen(req, timeout=10) as resp:
                  data = json.loads(resp.read().decode())
                  res = data.get("result")
                  if res:
                      marker = json.loads(res) if isinstance(res, str) else res
                      if isinstance(marker, dict) and marker.get("date") == today:
                          print(f"Redis marker hit: {marker_key} (sent_at={marker.get('sent_at')})")
                          if gh_output:
                              open(gh_output, "a", encoding="utf-8").write("sent=true\n")
                              if marker.get("resend_msg_id"):
                                  open(gh_output, "a", encoding="utf-8").write(f"resend_msg_id={marker.get('resend_msg_id')}\n")
                          sys.exit(0)
          except Exception as e:
              print(f"check Redis marker error: {e}", file=sys.stderr)
          open(gh_output, "a", encoding="utf-8").write("sent=false\n")
          EOF

      - name: Verify QStash email delivery
        id: delivery
        env:
          QSTASH_URL: ${{ secrets.QSTASH_URL }}
          QSTASH_TOKEN: ${{ secrets.QSTASH_TOKEN }}
          RESEND_MSG_ID: ${{ steps.check_sent.outputs.resend_msg_id }}
        run: python3 scripts/check_qstash_delivery.py

      - name: Determine if execution is needed
        id: should_run
        env:
          TODAY: ${{ env.TODAY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.check_sent.outputs.sent }}" = "true" ]; then
            if [ "${{ steps.delivery.outputs.delivery }}" = "failed" ]; then
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "QStash delivery failed, retry"
              exit 0
            fi
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Report already sent today (Redis marker), skip"
            exit 0
          fi
          API_SENT=$(python3 -c "
          import json, subprocess, sys, datetime as dt
          try:
              out = subprocess.check_output(['gh', 'run', 'list', '--workflow', 'checkin.yml', '--status', 'success', '--json', 'databaseId,createdAt,event', '--limit', '20'], text=True)
              runs = json.loads(out)
              tz = dt.timezone(dt.timedelta(hours=8))
              today = dt.datetime.now(tz).strftime('%Y-%m-%d')
              sent = False
              for r in runs:
                  # 只认可能发过报告的 run：主 cron（schedule）与手动非重试（workflow_dispatch）；
                  # repository_dispatch 接力 run 从不发报告，不能拿来推断「报告已发」
                  if r.get('event') == 'repository_dispatch':
                      continue
                  created_utc = dt.datetime.fromisoformat(r['createdAt'].replace('Z', '+00:00'))
                  created_bj = created_utc.astimezone(tz).strftime('%Y-%m-%d')
                  if created_bj == today:
                      sent = True
                      break
              print('true' if sent else 'false', flush=True)
          except Exception as e:
              import traceback; traceback.print_exc(file=sys.stderr)
              print('false', flush=True)
          ")
          if [ "$API_SENT" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Report already sent today (API check), skip"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send unified report
        id: send_report
        if: steps.should_run.outputs.skip != 'true'
        env:
          TZ: Asia/Shanghai
          DAILY_PUSH: "true"
          TASK_OUTPUT_DIR: .task_results
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          RESEND_TO: ${{ secrets.RESEND_TO }}
          QSTASH_URL: ${{ secrets.QSTASH_URL }}
          QSTASH_TOKEN: ${{ secrets.QSTASH_TOKEN }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python3 scripts/unified_report.py

      - name: Auto-retry failed sites
        if: always() && steps.should_run.outputs.skip != 'true' && steps.send_report.outputs.failed_matrix != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          FAILED_MATRIX: ${{ steps.send_report.outputs.failed_matrix }}
        run: |
          set -uo pipefail
          RETRIED=$(python3 - <<'EOF'
          import datetime as dt, json, subprocess
          tz = dt.timezone(dt.timedelta(hours=8))
          today = dt.datetime.now(tz).strftime("%Y-%m-%d")
          try:
              out = subprocess.check_output(
                  ["gh", "run", "list", "--workflow", "checkin.yml", "--event", "workflow_dispatch",
                   "--limit", "10", "--json", "createdAt"], text=True)
              runs = json.loads(out)
          except Exception:
              print("unknown", flush=True)
          else:
              hit = any(
                  dt.datetime.fromisoformat(r["createdAt"].replace("Z", "+00:00"))
                  .astimezone(tz).strftime("%Y-%m-%d") == today
                  for r in runs)
              print("true" if hit else "false", flush=True)
          EOF
          )
          if [ "$RETRIED" != "false" ]; then
            echo "Today already has a workflow_dispatch checkin run ($RETRIED), skip auto-retry"
            exit 0
          fi
          echo "Auto-retry failed sites: $FAILED_MATRIX"
          if gh workflow run checkin.yml --ref "${GITHUB_REF_NAME:-main}" -f tasks="$FAILED_MATRIX" -f retry=true; then
            echo "Retry dispatched"
          else
            echo "Retry dispatch failed"
          fi
