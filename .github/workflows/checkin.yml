name: Daily Check-in & Unified Task Queue

run-name: >-
  checkin: ${{ inputs.retry == true && 'auto-retry(report)' || (github.event_name == 'workflow_dispatch' && (inputs.tasks != '' && inputs.tasks || 'manual') || (github.event_name == 'repository_dispatch' && github.event.action || 'scheduled')) }}

on:
  schedule:
    # 主流水线：北京时间 14:00（UTC 06:00）单 run 全内联（任务完成即结束，
    # 硬墙 19:55（ORCH_HARD_DEADLINE）；latvi/重试/领奖回程均由延时接力承载）
    - cron: "0 6 * * *"
    # 心跳轮询：每 30 分钟一次（2026-09-06 由 4h 提频）。precheck 先行判定到期
    # 任务集：无到期则秒退（不启动代理/不装依赖）；有到期才执行滚动冷却任务
    # （modelscope 双实例 / cloudstudio 12h 冷却 / latvi 今日已签自去重，
    #  DUE_ONLY 按 last_credit_ts 状态决定）+ 到期分时段重试拾取。
    # 高频的意义：QStash 接力回调丢失时最多 30 分钟被兜底拾取；GH 高峰延迟
    # 调度时仍能覆盖各时段窗口
    - cron: "*/30 * * * *"
    # 报告兜底：北京时间 20:30（UTC 12:30，晚于硬墙 19:55（ORCH_HARD_DEADLINE）），仅走报告分支
    - cron: "30 12 * * *"
  repository_dispatch:
    types:
      - checkin_morning
      - checkin_modelscope
      - checkin_latvi
      - latvi_next_sign
      - workbuddy_travel_claim
      - daily_report
      - checkin_retry
  workflow_dispatch:
    inputs:
      tasks:
        description: '要执行的任务ID或脚本，逗号分隔（可选: all, matrix, workbuddy, glados, modelscope 等；留空按当日时间线默认）'
        required: false
        default: ''
        type: string
      reset_circuit:
        description: '重置并重新上线处于熔断状态的任务（等待修复后上线时勾选）'
        required: false
        default: false
        type: boolean
      retry:
        description: '标记为报告自动重跑（防循环；人工触发保持 false）'
        required: false
        default: false
        type: boolean
      due_only:
        description: '心跳模拟：仅滚动冷却任务 + 到期过滤 + 仅归档（不发邮件）'
        required: false
        default: false
        type: boolean
      direct:
        description: '诊断：跳过代理出站（sing-box 不启动），任务用 runner 自身 IP 直连（nodeseek 排查用）'
        required: false
        default: false
        type: boolean
      no_cffi:
        description: '诊断：nodeseek 强制 urllib/HTTP1.1（禁用 curl_cffi chrome 指纹）'
        required: false
        default: false
        type: boolean

# 最小权限（2026-09-06 审计）：GITHUB_TOKEN 仅用于 gh run list 与 PAT 缺失时的
# workflow_dispatch 兜底（actions: write 隐含 read）；无任何步骤写仓库内容。
permissions:
  contents: read
  actions: write

# ============================================================
# Job 1 — 统一编排主流水线（14:00 主 cron / 手动 / 旧接力兼容）
# ============================================================
jobs:
  unified:
    if: >-
      ${{ !(github.event_name == 'schedule' && github.event.schedule == '30 12 * * *')
          && github.event.action != 'daily_report' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      group: unified-${{ github.ref }}
      cancel-in-progress: false
    env:
      TZ: Asia/Shanghai
      TASK_OUTPUT_DIR: .task_results
      GITHUB_REPO: ${{ github.repository }}
      UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
      UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
      QSTASH_URL: ${{ secrets.QSTASH_URL }}
      QSTASH_TOKEN: ${{ secrets.QSTASH_TOKEN }}
