      MODELSCOPE_AI_COOKIE_1: ${{ secrets.MODELSCOPE_AI_COOKIE_1 || secrets.MODELSCOPE_AI_COOKIE }}
      MODELSCOPE_AI_COOKIE_2: ${{ secrets.MODELSCOPE_AI_COOKIE_2 }}
      MODELSCOPE_AI_COOKIE_3: ${{ secrets.MODELSCOPE_AI_COOKIE_3 }}
      MODELSCOPE_AI_COOKIE_4: ${{ secrets.MODELSCOPE_AI_COOKIE_4 }}
      MODELSCOPE_AI_COOKIE_5: ${{ secrets.MODELSCOPE_AI_COOKIE_5 }}
      LATVI_EMAIL: ${{ secrets.LATVI_EMAIL_1 || secrets.LATVI_EMAIL }}
      LATVI_PASSWORD: ${{ secrets.LATVI_PASSWORD_1 || secrets.LATVI_PASSWORD }}
      LATVI_EMAIL_1: ${{ secrets.LATVI_EMAIL_1 || secrets.LATVI_EMAIL }}
      LATVI_PASSWORD_1: ${{ secrets.LATVI_PASSWORD_1 || secrets.LATVI_PASSWORD }}
      LATVI_STATE_FILE: .latvi_state.json
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      RESEND_FROM: ${{ secrets.RESEND_FROM }}
      RESEND_TO: ${{ secrets.RESEND_TO }}
      MAIL_HOST: ${{ secrets.MAIL_HOST }}
      MAIL_PORT: ${{ secrets.MAIL_PORT }}
      MAIL_USER: ${{ secrets.MAIL_USER }}
      MAIL_PASS: ${{ secrets.MAIL_PASS }}
      MAIL_FROM: ${{ secrets.MAIL_FROM }}
      MAIL_TO: ${{ secrets.MAIL_TO }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4（SHA 固定，2026-09-06 审计）

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5（SHA 固定）
        with:
          python-version: "3.12"

      - name: Restore unified states
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4（SHA 固定）
        with:
          path: |
            .ai_router_state.json
            .latvi_state.json
            .agentrouter_state.json
            .cloudstudio_state*.json
            .2libra_state*.json
            .modelscope_*.json
            .juejin_state*.json
            .alipan_state*.json
            .smzdm_state*.json
            .52pojie_state*.json
            .notify_state_*.json
          key: unified-states-${{ github.run_id }}
          restore-keys: |
            unified-states-
            ai-router-state-
            latvi-state-
            agentrouter-state-

      # ── 到期前置判定（2026-09-06 运行模型改造）─────────────────────────
      # 空转 run 在此秒退：不启动 sing-box、不装依赖、不跑测试。只有在确有
      # 到期任务时才继续执行后续全部步骤。
      - name: Precheck due tasks (idle runs exit here)
        id: orch_tasks
        env:
          # 输入经 env 间接传递，避免 ${{ }} 直接内插 shell（引号/命令注入面）
          INPUT_TASKS: ${{ inputs.tasks }}
          INPUT_DUE_ONLY: ${{ inputs.due_only }}
          EVENT_ACTION: ${{ github.event.action }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          DUE_ONLY_FLAG=""
          IS_HEARTBEAT=false
          if [ "$EVENT_SCHEDULE" = "*/30 * * * *" ] || [ "$INPUT_DUE_ONLY" = "true" ]; then
            DUE_ONLY_FLAG="--due-only"
            IS_HEARTBEAT=true
          fi
          CANDIDATES=""
          if [ -n "$INPUT_TASKS" ]; then
            # 单行化防注入（2026-09-06 审计）：多行输入可注入额外键值对
            CANDIDATES=$(printf '%s' "$INPUT_TASKS" | tr '\n' ' ')
            echo "手动显式任务: $CANDIDATES（显式模式视为到期）"
          elif [ "$EVENT_ACTION" = "checkin_retry" ]; then
            CANDIDATES=$(python3 scripts/circuit_breaker.py get-due-retries 2>/dev/null || echo "")
            echo "分时段重试接力: 到期就绪任务 = ${CANDIDATES:-<无>}"
          elif [ "$IS_HEARTBEAT" = "true" ]; then
            # 心跳：滚动冷却任务 + latvi（今日已签自去重，兼作接力链断裂兜底）
            # + 到期分时段重试拾取；--plan 再按 last_credit_ts/已签过滤
            CANDIDATES="modelscope,modelscope_ai,tencent_cloudstudio,latvi"
            due_retries=$(python3 scripts/circuit_breaker.py get-due-retries 2>/dev/null || echo "")
            if [ -n "$due_retries" ]; then
              echo "心跳轮询附加到期重试任务: $due_retries"
              CANDIDATES="$CANDIDATES,$due_retries"
            fi
          elif [ -n "$EVENT_SCHEDULE" ] && [ "$EVENT_SCHEDULE" != "0 6 * * *" ]; then
            # schedule 事件兜底：显式匹配主 cron 才允许全量时间线；未识别的
            # schedule（GitHub 延迟重放/未来新增行）一律降级为心跳任务集
            echo "⚠️ 未识别的 schedule '$EVENT_SCHEDULE'，降级为心跳任务集"
            CANDIDATES="modelscope,modelscope_ai,tencent_cloudstudio,latvi"
            DUE_ONLY_FLAG="--due-only"
          else
            case "$EVENT_ACTION" in
              latvi_next_sign|checkin_latvi) CANDIDATES="latvi" ;;
              workbuddy_travel_claim)        CANDIDATES="workbuddy" ;;
              checkin_modelscope)            CANDIDATES="modelscope,modelscope_ai" ;;
              checkin_morning)               CANDIDATES="matrix,workbuddy" ;;
              *)                             CANDIDATES="" ;;
            esac
          fi
          if [ -n "$CANDIDATES" ]; then
            DUE=$(python3 scripts/daily_orchestrator.py --plan --tasks "$CANDIDATES" $DUE_ONLY_FLAG | sed -n 's/^DUE_TASKS=//p')
          else
            # 主 cron / 无候选：默认全量时间线口径评估（全熔断时也会空转秒退）
            DUE=$(python3 scripts/daily_orchestrator.py --plan $DUE_ONLY_FLAG | sed -n 's/^DUE_TASKS=//p')
          fi
          echo "tasks=${CANDIDATES}" >> "$GITHUB_OUTPUT"
          echo "due_tasks=${DUE:-none}" >> "$GITHUB_OUTPUT"
          if [ "${DUE:-none}" = "none" ]; then
            echo "🟢 空转 run：无到期任务，跳过代理/依赖/测试/执行（本 run 秒退）"
          else
            echo "✅ 到期任务: $DUE"
          fi

      - name: Direct mode (clear proxy env, runner IP 直连)
        if: inputs.direct == true
        run: |
          echo "NODESEEK_PROXY=" >> "$GITHUB_ENV"
          echo "AGENTROUTER_PROXY=" >> "$GITHUB_ENV"
          echo "2LIBRA_PROXY=" >> "$GITHUB_ENV"
          echo "CLOUDSTUDIO_PROXY=" >> "$GITHUB_ENV"
          echo "direct 诊断模式：跳过代理，任务用 runner IP 直连"
      - name: no_cffi mode (nodeseek 强制 urllib)
        if: inputs.no_cffi == true
        run: |
          echo "NODESEEK_NO_CFFI=1" >> "$GITHUB_ENV"
          echo "no_cffi 诊断模式：nodeseek 强制 urllib/HTTP1.1"

      - name: Install dependencies
        if: steps.orch_tasks.outputs.due_tasks != 'none'
        run: |
          pip install --no-cache-dir -r requirements.txt

      - name: Run unit test suite
        if: steps.orch_tasks.outputs.due_tasks != 'none'
        run: |
          python3 -m unittest discover -s scripts/tests/ -p "test_*.py"

      - name: Set TODAY
        if: steps.orch_tasks.outputs.due_tasks != 'none'
        run: echo "TODAY=$(TZ=Asia/Shanghai date +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Setup sing-box egress (唯一出站)
        if: inputs.direct != true && steps.orch_tasks.outputs.due_tasks != 'none'
        env:
          AGENTROUTER_SINGBOX_CONFIG: ${{ secrets.AGENTROUTER_SINGBOX_CONFIG }}
        run: |
          set -euo pipefail
          # 代理出站收敛（2026-09-06 清理）：sing-box 原生 JSON 为唯一出站隧道，
          # 承载 agentrouter/nodeseek/2libra/cloudstudio 的固定家宽出口。
          # 已删：mihomo 订阅拉取、sslocal(shadowsocks-rust) 两套独立隧道（2026-09-05）；
          #       自建代理池（SELF_HOSTED_PROXIES/CUSTOM_PROXIES）与全局备用池
          #       （AGENTROUTER_BACKUP_PROXIES）及其探测机器（2026-09-06）。
          # 代理出口状态入 Redis（proxy_setup 字段，14 天 TTL）：排查以 Redis 为准。
          stash_proxy_state() {
            [ -n "$UPSTASH_REDIS_REST_URL" ] && [ -n "$UPSTASH_REDIS_REST_TOKEN" ] || return 0
            python3 - "$1" "$2" "$3" "$4" <<'PY'
          import datetime, json, os, subprocess, sys
          mode, node, exit_ip, probe = (sys.argv + ["", "", "", ""])[1:5]
          prefix = os.getenv("CAT_CHECKIN_REDIS_PREFIX", "cat_checkin:").rstrip(":")
          tz = datetime.timezone(datetime.timedelta(hours=8))
          now = datetime.datetime.now(tz)
          dkey = f"{prefix}:raw:{now:%Y-%m-%d}"
          val = json.dumps({"mode": mode, "node": node, "exit_ip": exit_ip,
                            "nodeseek_probe": probe, "ts": now.isoformat(timespec="seconds")},
                           ensure_ascii=False)
          body = json.dumps([["HSET", dkey, "proxy_setup", val],
                             ["EXPIRE", dkey, 1209600]])
          try:
              r = subprocess.run(
                  ["curl", "-sS", "-m", "10", "-X", "POST",
                   os.environ["UPSTASH_REDIS_REST_URL"].rstrip("/") + "/pipeline",
                   "-H", "Authorization: Bearer " + os.environ["UPSTASH_REDIS_REST_TOKEN"],
                   "-H", "Content-Type: application/json", "-d", body],
                  capture_output=True, text=True, timeout=15)
              reply = (r.stdout or r.stderr or "").strip().replace("\n", " ")
              print(f"📜 proxy_setup → Redis({dkey}[proxy_setup]): {reply[:120]}")
          except Exception as exc:
              print(f"📜 proxy_setup → Redis 失败(忽略): {exc}")
          PY
          }

          # sing-box：用户直接提供的原生 JSON 配置（不走订阅拉取/转换）。
          # 修复 DNS：注入显式 dns 段（公共 UDP/TCP DNS + sniff），解决域名 NXDOMAIN
          # 泄漏（如 sing-box 直连 railgun.dnsbot.net 时 exchange6/exchange4 NXDOMAIN）。
          # inbound 强制锚定 127.0.0.1:1080（仅保留一个代理型 inbound），其余原样交付。
          setup_singbox() {
            test -n "$AGENTROUTER_SINGBOX_CONFIG" || { echo "AGENTROUTER_SINGBOX_CONFIG empty"; return 1; }
            # 供应链防护（2026-09-06 审计）：固定版本 + SHA256 校验，二进制被篡改时直接失败
            SINGBOX_SHA256="d2d6b4543d850269214ced70ffe41b13b1595baa1b6f9c016466abfba162c4d4"
            curl -sL --max-time 60 -o /tmp/singbox.tar.gz               https://github.com/SagerNet/sing-box/releases/download/v1.14.0/sing-box-1.14.0-linux-amd64-musl.tar.gz               || { echo "sing-box download failed"; return 1; }
            echo "$SINGBOX_SHA256  /tmp/singbox.tar.gz" | sha256sum -c - >/dev/null              || { echo "sing-box checksum mismatch, aborting"; return 1; }
            mkdir -p /tmp/singbox
            tar xzf /tmp/singbox.tar.gz -C /tmp/singbox --strip-components=1               || { echo "sing-box extract failed"; return 1; }
            test -x /tmp/singbox/sing-box || { echo "sing-box binary missing"; return 1; }
            printf '%s' "$AGENTROUTER_SINGBOX_CONFIG" > /tmp/singbox-config.json
            test -s /tmp/singbox-config.json || { echo "AGENTROUTER_SINGBOX_CONFIG empty"; return 1; }
            python3 - <<'PY' || return 1
          import json, sys
          p = "/tmp/singbox-config.json"
          try:
              cfg = json.load(open(p, encoding="utf-8"))
          except Exception as e:
              print(f"AGENTROUTER_SINGBOX_CONFIG not valid JSON: {e}")
              sys.exit(1)
          # ── 传输安全加固（2026-09-06）──────────────────────────────────────
          # 1) 出站 TLS 校验 fail-closed：拒绝 insecure（跳过证书验证）出站，
          #    防止隧道流量被静默中间人
          for ob in (cfg.get("outbounds") or []):
              tls = ob.get("tls") if isinstance(ob, dict) else None
              if isinstance(tls, dict) and tls.get("insecure"):
                  print(f"❌ outbound [{ob.get('tag', '?')}] 配置了 tls.insecure=true，拒绝启动。"
                        "请在 AGENTROUTER_SINGBOX_CONFIG 中移除 insecure 并配置受信证书/server_name。")
                  sys.exit(1)
          # 2) 仅保留一个代理型 inbound，锚定本地 1080 并统一收敛为 socks 类型
          #    （消费方全部是 socks5://127.0.0.1:1080，去除 mixed/http 额外暴露面）
          inbounds = cfg.get("inbounds") or []
          picked = None
          kept = []
          for ib in inbounds:
              if ib.get("type") in ("mixed", "socks", "http"):
                  if picked is None:
                      ib["listen"] = "127.0.0.1"
                      ib["listen_port"] = 1080
                      ib["type"] = "socks"
                      picked = ib
                      kept.append(ib)
              else:
                  kept.append(ib)
          if picked is None:
              kept.append({"type": "socks", "tag": "in_socks",
                           "listen": "127.0.0.1", "listen_port": 1080})
          cfg["inbounds"] = kept
          # 3) 注入显式 DNS：默认加密 DNS（DoT/DoH），防明文 UDP DNS 被劫持/篡改，
          #    并避免系统 resolver 在 CI 的 NXDOMAIN 抖动。
          #    ≥1.12 已弃用、1.14 移除 legacy {"tag","address"} 格式，必须显式带
          #    type；这里对已有 servers 做迁移（URL 正确拆分 host/port，DoT 默认 853）。
          import ipaddress as _ip, urllib.parse as _up
          def _is_ip(host) -> bool:
              try:
                  _ip.ip_address(str(host).strip("[]"))
                  return True
              except ValueError:
                  return False
          dns = cfg.get("dns") or {}
          servers = dns.get("servers")
          if not servers:
              servers = []
          migrated = []
          for idx, s in enumerate(servers):
              if isinstance(s, str):
                  migrated.append({"type": "udp", "tag": f"dns{idx}",
                                   "server": s})
                  continue
              d = dict(s)
              if "address" in d and "type" not in d:
                  addr = d.pop("address")
                  if isinstance(addr, str) and addr.startswith(("https://", "tls://")):
                      u = _up.urlsplit(addr)
                      d["server"] = u.hostname or addr.split("://", 1)[1]
                      d["type"] = "https" if addr.startswith("https://") else "tls"
                      if "server_port" not in d:
                          d["server_port"] = u.port or (443 if d["type"] == "https" else 853)
                  else:
                      d["server"] = addr
                      d["type"] = "udp"
              elif "type" not in d:
                  d["type"] = "udp"
              d.setdefault("tag", f"dns{idx}")
              migrated.append(d)
          if not migrated:
              # 默认加密 DNS：DoT(Google) + DoH(Cloudflare)，不再使用明文 UDP
              migrated = [
                  {"type": "tls", "tag": "dns-google-tls",
                   "server": "8.8.8.8", "server_port": 853},
                  {"type": "https", "tag": "dns-cloudflare-https",
                   "server": "1.1.1.1", "server_port": 443},
              ]
          # 引导 resolver：取首个 IP 直连可寻址的 DNS 服务器；没有则前置一个。
          # 1.12+ 要求域名型 DNS 服务器与域名型 outbound 都必须显式挂 resolver，
          # 否则 decode 直接报 missing domain resolver。
          bootstrap = next(
              (s for s in migrated if _is_ip(s.get("server", ""))), None)
          if bootstrap is None:
              bootstrap = {"type": "tls", "tag": "dns-bootstrap",
                           "server": "8.8.8.8", "server_port": 853}
              migrated.insert(0, bootstrap)
          for s in migrated:
              if not _is_ip(s.get("server", "")):
                  s.setdefault("domain_resolver", {"server": bootstrap["tag"]})
          dns["servers"] = migrated
          dns.setdefault("strategy", "ipv4_only")
          if not dns.get("final"):
              dns["final"] = dns["servers"][0]["tag"]
          cfg["dns"] = dns
          if "route" not in cfg:
              cfg["route"] = {}
          routes = cfg["route"]
          # 4) 路由规则（幂等注入到最前）：sniff 供域名嗅探/分流，DNS 请求统一
          #    hijack 进 sing-box DNS 模块（1.11+ action 语义，替代 legacy dns-out）
          rules = routes.get("rules") or []
          has_sniff = any(isinstance(r, dict) and r.get("action") == "sniff" for r in rules)
          has_dns_hijack = any(isinstance(r, dict) and r.get("action") == "hijack-dns" for r in rules)
          injected = []
          if not has_sniff:
              injected.append({"action": "sniff"})
          if not has_dns_hijack:
              injected.append({"protocol": "dns", "action": "hijack-dns"})
          if injected:
              routes["rules"] = injected + rules
          # 5) 解析机制现代化：route.default_domain_resolver 指向首个 DNS 服务器，
          #    域名型 outbound server（如 railgun.dnsbot.net）由它解析——替代已弃用的
          #    ENABLE_DEPRECATED_MISSING_DOMAIN_RESOLVER 兼容开关
          routes.setdefault("default_domain_resolver",
                            {"server": bootstrap["tag"]})
          cfg["route"] = routes
          json.dump(cfg, open(p, "w", encoding="utf-8"), ensure_ascii=False, indent=2)
          PY
            # 启动前配置校验（fail-closed）：check 不过（含注入段不被 1.14 接受）即中止
            if ! check_out=$(/tmp/singbox/sing-box check --config /tmp/singbox-config.json 2>&1); then
              echo "sing-box config check failed: $check_out"
              return 1
            fi
            pip install -q "pysocks==1.7.1" || { echo "pysocks install failed"; return 1; }
            /tmp/singbox/sing-box run --config /tmp/singbox-config.json >/tmp/singbox.log 2>&1 &
            SINGBOX_PID=$!
            echo "SINGBOX_PID=$SINGBOX_PID" >> "$GITHUB_ENV"
            for i in $(seq 1 30); do
              if ss -tln 2>/dev/null | grep -q ":1080 "; then break; fi
              sleep 0.5
            done
            sleep 1
            if ! ss -tln 2>/dev/null | grep -q ":1080 "; then
              echo "sing-box failed to listen on 1080; tail log:"; tail -n 20 /tmp/singbox.log || true
              kill -9 "$SINGBOX_PID" 2>/dev/null || true; return 1
            fi
            exit_ip=$(curl -sS -x "socks5://127.0.0.1:1080" -m 12 https://api.ipify.org 2>/dev/null || echo "")
            if [ -z "$exit_ip" ]; then
              echo "sing-box proxy forwarding failed; tearing down before fallback"; tail -n 20 /tmp/singbox.log || true
              kill -9 "$SINGBOX_PID" 2>/dev/null || true
              sleep 1
              return 1
            fi
            node_tag=$(python3 -c "import json; cfg=json.load(open('/tmp/singbox-config.json')); print((cfg.get('outbounds') or [{}])[0].get('tag','singbox'))" 2>/dev/null || echo "singbox")
            # 出口 IP 脱敏后入公开日志（与 proxy_manager.mask_host 同风格）；完整值仅入 Redis
            masked_ip=$(printf '%s' "$exit_ip" | awk -F. 'NF==4{print $1".***.***."$4; next} {print substr($0,1,2)"***"}')
            echo "sing-box ready (pid $SINGBOX_PID, outbound $node_tag, exit IP: $masked_ip)"
            # 为依赖固定出口的任务注入代理环境变量
            echo "AGENTROUTER_PROXY=socks5://127.0.0.1:1080" >> "$GITHUB_ENV"
            echo "NODESEEK_PROXY=socks5://127.0.0.1:1080" >> "$GITHUB_ENV"
            echo "2LIBRA_PROXY=socks5://127.0.0.1:1080" >> "$GITHUB_ENV"
            echo "CLOUDSTUDIO_PROXY=socks5://127.0.0.1:1080" >> "$GITHUB_ENV"
            ns_code=$(curl -sS -x "socks5://127.0.0.1:1080" -m 12 -o /dev/null -w '%{http_code}' https://www.nodeseek.com/ 2>/dev/null || echo 000)
            echo "sing-box egress ready on 127.0.0.1:1080 (pid $SINGBOX_PID), nodeseek probe HTTP $ns_code"
            stash_proxy_state singbox "$node_tag" "$exit_ip" "$ns_code"
            return 0
          }

          # sing-box 是唯一出站：启动失败时记录状态后按设计公平失败
          # （agentrouter 等指纹任务会显式报错，绝不静默直连）
          if ! setup_singbox; then
            echo "所有代理均不可用（sing-box 启动/探活失败）；agentrouter 将按设计触发公平失败"
            stash_proxy_state none "" "" ""
          fi

      - name: Execute daily orchestrator
        id: orchestrator
        if: steps.orch_tasks.outputs.due_tasks != 'none'
        env:
          ORCH_TASKS: ${{ steps.orch_tasks.outputs.tasks }}
          # 仅本步骤需要 PAT：latvi/workbuddy 子任务的 repository_dispatch 与 Secret 回写
          GH_PAT: ${{ secrets.GH_PAT }}
          # 心跳轮询 run（30 分钟 cron 或手动 due_only）：滚动冷却任务按 last_credit_ts
          # 到期过滤，未到期秒级跳过
          DUE_ONLY: ${{ (github.event.schedule == '*/30 * * * *' || inputs.due_only == true) && '1' || '0' }}
          # 输入经 env 间接传递，避免 ${{ }} 直接内插 shell
          RESET_CIRCUIT: ${{ inputs.reset_circuit }}
        run: |
          RESET_FLAG=""
          if [ "$RESET_CIRCUIT" = "true" ]; then
            RESET_FLAG="--reset-circuit"
          fi
          if [ -n "$ORCH_TASKS" ]; then
            if [ "$ORCH_TASKS" = "none" ]; then
              echo "无到期任务执行，跳过调度"
              exit 0
            fi
            python3 scripts/daily_orchestrator.py --tasks "$ORCH_TASKS" $RESET_FLAG
          else
            python3 scripts/daily_orchestrator.py $RESET_FLAG
          fi

      - name: Send unified report
        id: send_report
        if: >-
          always()
          && steps.orch_tasks.outputs.due_tasks != 'none'
          && steps.orch_tasks.outputs.due_tasks != ''
          && !(github.event_name == 'repository_dispatch'
               && contains(fromJSON('["latvi_next_sign","checkin_latvi","checkin_morning","checkin_modelscope","workbuddy_travel_claim"]'), github.event.action))
        env:
          DAILY_PUSH: "true"
          # PAT 供 secret_age 凭据年龄预警（secret_age.py 经 daily_report 导入）
          GH_PAT: ${{ secrets.GH_PAT }}
          # 心跳轮询 run：仅归档刷新当日汇总，不发邮件/不写 marker（每日邮件由主 run 承担）
          ARCHIVE_ONLY: ${{ (github.event.schedule == '*/30 * * * *' || inputs.due_only == true) && '1' || '0' }}
          # 重跑 run 发送「[重跑]」补充邮件（不写当日 marker、不再触发递归重试）
          RETRY_REPORT: ${{ inputs.retry == true && '1' || '0' }}
        run: python3 scripts/unified_report.py

      - name: Auto-retry failed sites
        if: >-
          always() && steps.send_report.outputs.failed_matrix != ''
          && !(github.event_name == 'repository_dispatch'
               && contains(fromJSON('["latvi_next_sign","checkin_latvi","checkin_morning","checkin_modelscope","workbuddy_travel_claim"]'), github.event.action))
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          FAILED_MATRIX: ${{ steps.send_report.outputs.failed_matrix }}
        run: |
          set -uo pipefail
          # 1. 评估重试候选站点的重试资质与熔断状态（8次失败上限检查）
          # 安全解析 key=value 输出，严格白名单导入环境变量，彻底避免 eval
          while IFS='=' read -r key val; do
            case "$key" in
              TOTAL_CHECKED|SHOULD_RETRY|RETRYABLE_TASKS|DUE_TASKS|SUSPENDED_TASKS|NEXT_DELAY_SECONDS)
                export "$key=$val"
                ;;
            esac
          done < <(python3 scripts/circuit_breaker.py check-retry "$FAILED_MATRIX")
          if [ -n "${SUSPENDED_TASKS:-}" ]; then
            echo "🛑 任务已达 8 次失败上限触发熔断停用，停止自动重试（等待修复上线）: $SUSPENDED_TASKS"
          fi
          if [ "${SHOULD_RETRY:-false}" != "true" ]; then
            echo "无可用重试任务（均已熔断或无需重跑），停止自动重试流程"
            exit 0
          fi

          echo "分时段候选重试任务: $RETRYABLE_TASKS (等待时延: ${NEXT_DELAY_SECONDS:-900}s)"

          # 2. 优先尝试 QStash 延时接力（零 runner 费用等待，待到期后精准 dispatch 回调）
          QSTASH_OK=$(python3 - "${NEXT_DELAY_SECONDS:-900}" <<'PY'
          import sys, os
          from common import schedule_repo_dispatch
          delay = int(sys.argv[1]) if len(sys.argv) > 1 and sys.argv[1].isdigit() else 900
          ok, msg = schedule_repo_dispatch("checkin_retry", delay)
          print(f"ok={str(ok).lower()};msg={msg}")
          PY
          )
          echo "QStash 调度结果: $QSTASH_OK"

          if echo "$QSTASH_OK" | grep -q "ok=true"; then
            echo "✅ QStash 已安排在 ${NEXT_DELAY_SECONDS:-900}s 后延时回调 checkin_retry，期间零占用 runner 计费分钟数"
            exit 0
          fi

          # 3. 若未配置 QStash：
          # 重试计划已在 Redis/本地 KV 中持久化，由心跳 cron (每 4h) 或下次定时 run 自动到期拾取；
          # 若时延极短（<= 120s），则可原地微等后触发 workflow_dispatch
          if [ "${NEXT_DELAY_SECONDS:-900}" -le 120 ]; then
            echo "等待 ${NEXT_DELAY_SECONDS}s 短时冷却..."
            sleep "${NEXT_DELAY_SECONDS}"
            if gh workflow run checkin.yml --ref "${GITHUB_REF_NAME:-main}" -f tasks="$RETRYABLE_TASKS" -f retry=true; then
              echo "即时重跑已派发"
            fi
          else
            echo "分时段重试：任务重试计划已记录到 Upstash Redis/状态缓存中，将由每 4h 心跳轮询到期自动拾取，避免原地等待浪费 runner 额度。"
          fi

      - name: Save unified states
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4（SHA 固定）
        with:
          path: |
            .ai_router_state.json
            .latvi_state.json
            .agentrouter_state.json
            .cloudstudio_state*.json
            .2libra_state*.json
            .modelscope_*.json
            .juejin_state*.json
            .alipan_state*.json
            .smzdm_state*.json
            .52pojie_state*.json
            .notify_state_*.json
          key: unified-states-${{ github.run_id }}

      - name: Cleanup sing-box tunnel
        if: always()
        run: |
          kill "${SINGBOX_PID:-}" 2>/dev/null || true
          sudo -n kill "${SINGBOX_PID:-}" 2>/dev/null || true
          sudo -n pkill -f '[s]ing-box' 2>/dev/null || true

      - name: Upload unified results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4（SHA 固定）
        with:
          name: unified-results
          path: .task_results/
          retention-days: 7
          include-hidden-files: true
          if-no-files-found: ignore # 空转 run 无结果文件，忽略即可

  # ============================================================
  # Job 2 — 报告兜底（20:30 晚于硬墙，仅当主 run 未发报告时补发）
  # ============================================================
  report-fallback:
    if: >-
      ${{ github.event_name == 'schedule' && github.event.schedule == '30 12 * * *'
          || github.event.action == 'daily_report' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: report-fallback-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4（SHA 固定，2026-09-06 审计）

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5（SHA 固定）
        with:
          python-version: "3.12"

      - name: Syntax check
        run: python3 -m py_compile scripts/*.py

      - name: Set TODAY
        run: echo "TODAY=$(TZ=Asia/Shanghai date +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Check if report sent today (Redis marker)
        id: check_sent
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          TODAY: ${{ env.TODAY }}
        run: |
          python3 <<'EOF'
          import os, json, sys, urllib.request
          url = (os.getenv("UPSTASH_REDIS_REST_URL") or "").rstrip("/")
          token = os.getenv("UPSTASH_REDIS_REST_TOKEN") or ""
          today = os.getenv("TODAY", "")
          gh_output = os.getenv("GITHUB_OUTPUT")
          prefix = (os.getenv("CAT_CHECKIN_REDIS_PREFIX") or "cat_checkin:").rstrip(":")
          marker_key = f"{prefix}:sent:{today}"
          if not url or not token:
              if gh_output:
                  open(gh_output, "a", encoding="utf-8").write("sent=false\n")
              sys.exit(0)
          req = urllib.request.Request(f"{url}/get/{marker_key}", headers={"Authorization": f"Bearer {token}", "Accept": "application/json"})
          try:
              with urllib.request.urlopen(req, timeout=10) as resp:
                  data = json.loads(resp.read().decode())
                  res = data.get("result")
                  if res:
                      marker = json.loads(res) if isinstance(res, str) else res
                      if isinstance(marker, dict) and marker.get("date") == today:
                          print(f"Redis marker hit: {marker_key} (sent_at={marker.get('sent_at')})")
                          if gh_output:
                              open(gh_output, "a", encoding="utf-8").write("sent=true\n")
                              if marker.get("resend_msg_id"):
                                  open(gh_output, "a", encoding="utf-8").write(f"resend_msg_id={marker.get('resend_msg_id')}\n")
                          sys.exit(0)
          except Exception as e:
              print(f"check Redis marker error: {e}", file=sys.stderr)
          open(gh_output, "a", encoding="utf-8").write("sent=false\n")
          EOF

      - name: Verify QStash email delivery
        id: delivery
        env:
          QSTASH_URL: ${{ secrets.QSTASH_URL }}
          QSTASH_TOKEN: ${{ secrets.QSTASH_TOKEN }}
          RESEND_MSG_ID: ${{ steps.check_sent.outputs.resend_msg_id }}
        run: python3 scripts/check_qstash_delivery.py

      - name: Determine if execution is needed
        id: should_run
        env:
          TODAY: ${{ env.TODAY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.check_sent.outputs.sent }}" = "true" ]; then
            if [ "${{ steps.delivery.outputs.delivery }}" = "failed" ]; then
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "QStash delivery failed, retry"
              exit 0
            fi
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Report already sent today (Redis marker), skip"
            exit 0
          fi
          API_SENT=$(python3 -c "
          import json, subprocess, sys, datetime as dt
          try:
              out = subprocess.check_output(['gh', 'run', 'list', '--workflow', 'checkin.yml', '--status', 'success', '--json', 'databaseId,createdAt,event', '--limit', '20'], text=True)
              runs = json.loads(out)
              tz = dt.timezone(dt.timedelta(hours=8))
              today = dt.datetime.now(tz).strftime('%Y-%m-%d')
              sent = False
              for r in runs:
                  # 只认可能发过报告的 run：主 cron（schedule）与手动非重试（workflow_dispatch）；
                  # repository_dispatch 接力 run 从不发报告，不能拿来推断「报告已发」
                  if r.get('event') == 'repository_dispatch':
                      continue
                  created_utc = dt.datetime.fromisoformat(r['createdAt'].replace('Z', '+00:00'))
                  created_bj = created_utc.astimezone(tz).strftime('%Y-%m-%d')
                  if created_bj == today:
                      sent = True
                      break
              print('true' if sent else 'false', flush=True)
          except Exception as e:
              import traceback; traceback.print_exc(file=sys.stderr)
              print('false', flush=True)
          ")
          if [ "$API_SENT" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Report already sent today (API check), skip"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send unified report
        id: send_report
        if: steps.should_run.outputs.skip != 'true'
        env:
          TZ: Asia/Shanghai
          DAILY_PUSH: "true"
          TASK_OUTPUT_DIR: .task_results
          # 凭据年龄预警（secret_age.py）需要读 Secrets 的 updated_at
          GH_PAT: ${{ secrets.GH_PAT }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          RESEND_TO: ${{ secrets.RESEND_TO }}
          QSTASH_URL: ${{ secrets.QSTASH_URL }}
          QSTASH_TOKEN: ${{ secrets.QSTASH_TOKEN }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python3 scripts/unified_report.py

      - name: Auto-retry failed sites
        if: always() && steps.should_run.outputs.skip != 'true' && steps.send_report.outputs.failed_matrix != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          FAILED_MATRIX: ${{ steps.send_report.outputs.failed_matrix }}
        run: |
          set -uo pipefail
          RETRIED=$(python3 - <<'EOF'
          import datetime as dt, json, subprocess
          tz = dt.timezone(dt.timedelta(hours=8))
          today = dt.datetime.now(tz).strftime("%Y-%m-%d")
          try:
              out = subprocess.check_output(
                  ["gh", "run", "list", "--workflow", "checkin.yml", "--event", "workflow_dispatch",
                   "--limit", "10", "--json", "createdAt"], text=True)
              runs = json.loads(out)
          except Exception:
              print("unknown", flush=True)
          else:
              hit = any(
                  dt.datetime.fromisoformat(r["createdAt"].replace("Z", "+00:00"))
                  .astimezone(tz).strftime("%Y-%m-%d") == today
                  for r in runs)
              print("true" if hit else "false", flush=True)
          EOF
          )
          if [ "$RETRIED" != "false" ]; then
            echo "Today already has a workflow_dispatch checkin run ($RETRIED), skip auto-retry"
            exit 0
          fi
          echo "Auto-retry failed sites: $FAILED_MATRIX"
          if gh workflow run checkin.yml --ref "${GITHUB_REF_NAME:-main}" -f tasks="$FAILED_MATRIX" -f retry=true; then
            echo "Retry dispatched"
          else
            echo "Retry dispatch failed"
          fi
