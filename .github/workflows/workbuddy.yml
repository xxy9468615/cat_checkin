name: WorkBuddy Check-in

on:
  schedule:
    # 北京时间 00:50（UTC 16:50）每日触发，GitHub Actions 低谷期；
    # 4 小时放风旅行 + QStash 延时接力约 05:00 前完成，早于 10:00 统一邮件
    - cron: "50 16 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [workbuddy_travel_claim]

permissions:
  contents: read

concurrency:
  group: workbuddy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  workbuddy:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # 放风改为延时调度，不再阻塞等待；签到/兑换/抽奖/状态查询正常 < 5 分钟，AI 对话轮询上限 120s

    # 多账号独立流程：每个账号用各自独立的 Cookie（独立 secret），互不打扰，
    # 防风回访领取礼物也更方便。
    strategy:
      fail-fast: false
      matrix:
        include:
          - account: "1"
            secret: WORKBUDDY_COOKIE
          - account: "2"
            secret: WORKBUDDY_COOKIE_2

    env:
      TZ: Asia/Shanghai
      GITHUB_REPO: ${{ github.repository }}
      QSTASH_URL: ${{ secrets.QSTASH_URL }}
      QSTASH_TOKEN: ${{ secrets.QSTASH_TOKEN }}
      GH_PAT: ${{ secrets.GH_PAT }}
      WORKBUDDY_COOKIE: ${{ secrets[matrix.secret] }}
      WORKBUDDY_WAIT_TRAVEL: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # 与本地开发环境对齐，避免 3.12-only 语法只在 CI 爆

      - name: Set TODAY
        run: echo "TODAY=$(TZ=Asia/Shanghai date +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Syntax check (stdlib only)
        run: python3 -m py_compile scripts/*.py

      - name: Run WorkBuddy check-in (account ${{ matrix.account }})
        run: python3 scripts/run_task.py scripts/workbuddy.py
        env:
          # 每个账号写入独立的结果文件名，避免多账号结果互相覆盖
          TASK_RESULT_NAME: workbuddy-account-${{ matrix.account }}.json
          # 单账号正常 <5 分钟，但 AI 对话轮询上限 120s + 兑换/抽奖/放风链路在服务端
          # 劣化时会超 300s 默认值（签到可能已成功却被记超时失败），放宽到 25 分钟
          TASK_TIMEOUT: "1500"

      # report.yml 的统一汇总通过 download-artifact 读取结果（pattern: workbuddy-result-*），
      # 不再单独发邮件，全部并入每日 10:00 统一报告。
      - name: Upload task result artifact (account ${{ matrix.account }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workbuddy-result-account-${{ matrix.account }}
          path: .task_results/
          retention-days: 1
          include-hidden-files: true
