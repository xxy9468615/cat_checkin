name: Daily Unified Report

on:
  schedule:
    - cron: "0 2 * * *"   # 北京时间 10:00 主定时（每日统一汇总推送）
    - cron: "30 2 * * *"  # 北京时间 10:30 兜底定时（覆盖 GitHub cron 抖动）
  workflow_dispatch:
    inputs:
      force:
        description: '是否强制重新发送（忽略今日已发送标记）'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: report-${{ github.ref }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # 与本地开发环境对齐，避免 3.12-only 语法只在 CI 爆

      - name: Syntax check (stdlib only)
        run: python3 -m py_compile scripts/*.py

      - name: Set TODAY
        run: echo "TODAY=$(TZ=Asia/Shanghai date +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Check if report sent today
        id: check_sent
        uses: actions/cache/restore@v4
        with:
          path: .report_sent
          key: report-sent-${{ env.TODAY }}

      - name: Determine if execution is needed
        id: should_run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "🔄 手动强制重发，忽略已发送标记"
            exit 0
          fi

          if [ "${{ steps.check_sent.outputs.cache-hit }}" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "✅ 今日报告已于更早时间成功推送，跳过重复发送 (Cache Hit)"
            exit 0
          fi

          echo "Checking GitHub API for successful runs today..."
          API_SENT=$(python3 -c "
          import json, subprocess, os, datetime as dt
          try:
              out = subprocess.check_output(['gh', 'run', 'list', '--workflow', 'Daily Unified Report', '--status', 'success', '--json', 'databaseId,createdAt', '--limit', '10'], text=True)
              runs = json.loads(out)
              tz = dt.timezone(dt.timedelta(hours=8))
              today = dt.datetime.now(tz).strftime('%Y-%m-%d')

              sent = False
              for r in runs:
                  created_utc = dt.datetime.fromisoformat(r['createdAt'].replace('Z', '+00:00'))
                  created_bj = created_utc.astimezone(tz).strftime('%Y-%m-%d')
                  if created_bj == today:
                      print(f'Found successful run today: {r[\"databaseId\"]} at {created_bj}')
                      sent = True
                      break
              print('true' if sent else 'false')
          except Exception as e:
              import traceback
              traceback.print_exc()
              print('false')
          ")

          if [ "$API_SENT" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "✅ 今日报告已于更早时间成功推送，跳过重复发送 (API Check Hit)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # 1. 主路径：跨 run 下载各任务的 artifact 结果。
      #    注意：download-artifact action 默认只可见当前 run 的 artifact（各任务在别的 run），
      #    cache 的 restore-keys 前缀也只命中最近一条（矩阵每腿独立保存），
      #    因此必须用 gh run download 按 run-id 跨 run 拉取。
      - name: Download task results from task runs
        if: steps.should_run.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          TODAY_BJ=$(TZ=Asia/Shanghai date +%Y-%m-%d)
          YDAY_BJ=$(TZ=Asia/Shanghai -d "yesterday" +%Y-%m-%d)
          fetch_latest() {  # fetch_latest <workflow-name> <artifact-pattern> <min-bj-date>
            local wf="$1" pattern="$2" mind="$3" raw rids
            # 只取 min-date 之后完成的 run：防止 10:00 时今日 run 尚未完成，
            # 一路回退拿昨日 run 的过期 artifact（retention 已过 → 下载失败/白名单丢弃）
            raw=$(gh run list --workflow "$wf" --status completed --limit 10 \
                  --json databaseId,createdAt --jq '.[] | [.databaseId, .createdAt] | @tsv' 2>/dev/null || true)
            rids=$(printf '%s\n' "$raw" | python3 -c '
          import sys, datetime as dt
          tz = dt.timezone(dt.timedelta(hours=8))
          mind = sys.argv[1]
          for line in sys.stdin:
              parts = line.rstrip("\n").split("\t")
              if len(parts) != 2:
                  continue
              rid, created = parts
              try:
                  bj = dt.datetime.fromisoformat(created.replace("Z", "+00:00")).astimezone(tz)
              except ValueError:
                  continue
              if bj.strftime("%Y-%m-%d") >= mind:
                  print(rid)
          ' "$mind")
            if [ -z "$rids" ]; then
              echo "⚠️ $wf 在 $mind 起没有已完成的 run，跳过（期望清单会标红）"
              return 0
            fi
            local tried=0 rid
            for rid in $rids; do
              tried=$((tried+1))
              [ "$tried" -gt 3 ] && break
              echo "⬇️ $wf（run $rid）: $pattern"
              if gh run download "$rid" --pattern "$pattern" --dir .task_results; then
                echo "✅ $wf 结果已下载"
                return 0
              fi
              echo "⚠️ $wf run $rid 下载失败（可能超过 1 天保留期），尝试次新 run"
            done
            echo "⚠️ $wf 全部候选 run 下载失败（期望清单会标红）"
          }
          fetch_latest "Daily Check-in (Matrix Async)" "task-result-*" "$TODAY_BJ"
          fetch_latest "WorkBuddy Check-in" "workbuddy-result-*" "$TODAY_BJ"
          # ModelScope 单独 09:10 跑（魔粒奖励凌晨未开放，混在 00:50 矩阵必失败）
          fetch_latest "ModelScope Check-in" "task-result-modelscope.py" "$TODAY_BJ"
          # Latvi 固定 18:00 运行（24h 间隔约束），10:00 报告取最近一次（昨日）结果
          fetch_latest "Latvi Check-in" "task-result-latvi.py" "$YDAY_BJ"

      # 2. 兜底：从 cache 恢复（前缀命中最近一条单腿结果，仅作补充）
      - name: Restore task results from cache (fallback)
        if: steps.should_run.outputs.skip != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .task_results/
          key: task-results-${{ env.TODAY }}-${{ github.run_id }}
          restore-keys: |
            task-result-
        continue-on-error: true

      - name: Verify collected result files
        if: steps.should_run.outputs.skip != 'true'
        run: |
          count=$(find .task_results -name "*.json" 2>/dev/null | wc -l)
          echo "📊 .task_results/ 目录共发现 $count 份任务结果 JSON"
          if [ "$count" -eq 0 ]; then
            echo "⚠️ 未发现任何任务结果文件"
            exit 1
          fi
          echo "✅ 结果文件就绪，开始执行统一邮件汇总推送"

      - name: Send unified report
        if: steps.should_run.outputs.skip != 'true'
        env:
          TZ: Asia/Shanghai
          DAILY_PUSH: "true"
          TASK_OUTPUT_DIR: .task_results
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          RESEND_TO: ${{ secrets.RESEND_TO }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python3 scripts/unified_report.py

      # always()：脚本有任务失败时 exit 1，但邮件已发出、标记已写，必须照常保存；
      # hashFiles：无结果中止时标记不存在，跳过保存（让 10:30 兜底重试）
      - name: Save report sent marker
        if: always() && steps.should_run.outputs.skip != 'true' && hashFiles('.report_sent') != ''
        uses: actions/cache/save@v4
        with:
          path: .report_sent
          key: report-sent-${{ env.TODAY }}
