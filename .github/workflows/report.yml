name: Daily Unified Report

on:
  schedule:
    # 北京时间 09:35（UTC 01:35）触发，避开整点/半点 Actions 排队拥堵高峰；
    # 此时 00:50 的 checkin/workbuddy 与 09:10 的 modelscope 均已完成
    - cron: "35 1 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: '是否强制重新发送（忽略今日已发送标记）'
        required: false
        type: boolean
        default: false

permissions:
  contents: write  # workflow dispatch 重跑（GITHUB_TOKEN 兜底路径）；每日汇总历史现存入 Upstash Redis，不再提交 data 分支
  actions: write   # gh workflow run 触发 checkin.yml 重跑（write 含 read，跨 run 拉 artifact 亦可用）

concurrency:
  group: report-${{ github.ref }}
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # 与本地开发环境对齐，避免 3.12-only 语法只在 CI 爆

      - name: Syntax check (stdlib only)
        run: python3 -m py_compile scripts/*.py

      - name: Set TODAY
        run: echo "TODAY=$(TZ=Asia/Shanghai date +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Check if report sent today (Redis marker)
        id: check_sent
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          TODAY: ${{ env.TODAY }}
        run: |
          python3 <<'EOF'
          import os, json, sys, urllib.request
          url = (os.getenv("UPSTASH_REDIS_REST_URL") or "").rstrip("/")
          token = os.getenv("UPSTASH_REDIS_REST_TOKEN") or ""
          today = os.getenv("TODAY", "")
          gh_output = os.getenv("GITHUB_OUTPUT")
          prefix = (os.getenv("CAT_CHECKIN_REDIS_PREFIX") or "cat_checkin:").rstrip(":")
          marker_key = f"{prefix}:sent:{today}"

          if not url or not token:
              if gh_output:
                  with open(gh_output, "a", encoding="utf-8") as f:
                      f.write("sent=false\n")
              sys.exit(0)

          req = urllib.request.Request(
              f"{url}/get/{marker_key}",
              headers={"Authorization": f"Bearer {token}", "Accept": "application/json"},
          )
          try:
              with urllib.request.urlopen(req, timeout=10) as resp:
                  data = json.loads(resp.read().decode())
                  res = data.get("result")
                  if res:
                      marker = json.loads(res) if isinstance(res, str) else res
                      if isinstance(marker, dict) and marker.get("date") == today:
                          print(f"✅ Redis 发现今日已发送标记: {marker_key} (sent_at={marker.get('sent_at')})")
                          if gh_output:
                              with open(gh_output, "a", encoding="utf-8") as f:
                                  f.write("sent=true\n")
                                  if marker.get("resend_msg_id"):
                                      f.write(f"resend_msg_id={marker.get('resend_msg_id')}\n")
                          sys.exit(0)
          except Exception as e:
              print(f"⚠️ 检查 Redis 发送标记异常: {e}", file=sys.stderr)

          if gh_output:
              with open(gh_output, "a", encoding="utf-8") as f:
                  f.write("sent=false\n")
          EOF

      - name: Verify QStash email delivery
        id: delivery
        env:
          QSTASH_URL: ${{ secrets.QSTASH_URL }}
          QSTASH_TOKEN: ${{ secrets.QSTASH_TOKEN }}
        run: python3 scripts/check_qstash_delivery.py

      - name: Determine if execution is needed
        id: should_run
        env:
          TODAY: ${{ env.TODAY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "🔄 手动强制重发，忽略已发送标记"
            exit 0
          fi

          # 1. 优先检查 Redis 发送标记
          if [ "${{ steps.check_sent.outputs.sent }}" = "true" ]; then
            # QStash 投递明确失败（重试耗尽入 DLQ）→ 触发重发
            if [ "${{ steps.delivery.outputs.delivery }}" = "failed" ]; then
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "❌ QStash 报告邮件投递失败（重试耗尽），触发重发"
              exit 0
            fi
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "✅ 今日报告已于更早时间成功推送，跳过重复发送 (Redis Marker Hit: $TODAY)"
            exit 0
          fi

          # 2. 兜底 API 查重（纯净 stdout 输出，debug 信息输出到 stderr，防多行污染变量）
          echo "Checking GitHub API for successful runs today..."
          API_SENT=$(python3 -c "
          import json, subprocess, sys, datetime as dt
          try:
              out = subprocess.check_output(['gh', 'run', 'list', '--workflow', 'report.yml', '--status', 'success', '--json', 'databaseId,createdAt', '--limit', '10'], text=True)
              runs = json.loads(out)
              tz = dt.timezone(dt.timedelta(hours=8))
              today = dt.datetime.now(tz).strftime('%Y-%m-%d')

              sent = False
              for r in runs:
                  created_utc = dt.datetime.fromisoformat(r['createdAt'].replace('Z', '+00:00'))
                  created_bj = created_utc.astimezone(tz).strftime('%Y-%m-%d')
                  if created_bj == today:
                      sys.stderr.write(f'Found successful run today: {r[\"databaseId\"]} at {created_bj}\n')
                      sent = True
                      break
              print('true' if sent else 'false', flush=True)
          except Exception as e:
              import traceback
              traceback.print_exc(file=sys.stderr)
              print('false', flush=True)
          ")

          if [ "$API_SENT" = "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "✅ 今日报告已于更早时间成功推送，跳过重复发送 (API Check Hit)"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Send unified report
        id: send_report
        if: steps.should_run.outputs.skip != 'true'
        env:
          TZ: Asia/Shanghai
          DAILY_PUSH: "true"
          TASK_OUTPUT_DIR: .task_results
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          RESEND_TO: ${{ secrets.RESEND_TO }}
          QSTASH_URL: ${{ secrets.QSTASH_URL }}
          QSTASH_TOKEN: ${{ secrets.QSTASH_TOKEN }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python3 scripts/unified_report.py

      # 红卡自动重跑：邮件发出后，对失败/缺席的矩阵站点自动 dispatch checkin.yml 重签。
      # 站点签到服务端幂等（已签到一律放行），重跑安全；重跑落同名 artifact（新数据胜出），
      # 结果以站点余额/奖励为准，次日报告或手动 force 重发邮件时可见。
      # 防循环：每日最多自动重跑一次——今日已存在 workflow_dispatch 触发的 checkin run
      #（人工或自动）即跳过。独立 workflow 站点（workbuddy/modelscope/latvi）有各自
      # 恢复机制，不在重跑范围。
      - name: Auto-retry failed matrix sites
        if: always() && steps.should_run.outputs.skip != 'true' && steps.send_report.outputs.failed_matrix != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          FAILED_MATRIX: ${{ steps.send_report.outputs.failed_matrix }}
        run: |
          set -uo pipefail
          RETRIED=$(python3 - <<'EOF'
          import datetime as dt, json, subprocess
          tz = dt.timezone(dt.timedelta(hours=8))
          today = dt.datetime.now(tz).strftime("%Y-%m-%d")
          try:
              out = subprocess.check_output(
                  ["gh", "run", "list", "--workflow", "checkin.yml", "--event", "workflow_dispatch",
                   "--limit", "10", "--json", "createdAt"], text=True)
              runs = json.loads(out)
          except Exception:
              print("unknown", flush=True)
          else:
              hit = any(
                  dt.datetime.fromisoformat(r["createdAt"].replace("Z", "+00:00"))
                  .astimezone(tz).strftime("%Y-%m-%d") == today
                  for r in runs)
              print("true" if hit else "false", flush=True)
          EOF
          )
          if [ "$RETRIED" != "false" ]; then
            echo "ℹ️ 今日已存在手动/自动触发的 checkin run（$RETRIED），跳过自动重跑"
            exit 0
          fi
          echo "🔁 失败矩阵站点自动重跑：$FAILED_MATRIX"
          if gh workflow run checkin.yml --ref "${GITHUB_REF_NAME:-main}" -f scripts="$FAILED_MATRIX" -f retry=true; then
            echo "✅ 重跑已触发（站点签到服务端幂等，重复执行安全）"
          else
            echo "⚠️ 自动重跑触发失败，请人工检查"
          fi
