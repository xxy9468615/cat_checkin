name: Export Secrets for Local Migration

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dump Secrets to File
        env:
          WORKBUDDY_COOKIE: ${{ secrets.WORKBUDDY_COOKIE }}
          WORKBUDDY_COOKIE_2: ${{ secrets.WORKBUDDY_COOKIE_2 }}
          GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
          GLADOS_ACCOUNTS: ${{ secrets.GLADOS_ACCOUNTS }}
          TWO_LIBRA_COOKIES: ${{ secrets.TWO_LIBRA_COOKIES }}
          BIANJIE_AI_ACCOUNTS: ${{ secrets.BIANJIE_AI_ACCOUNTS }}
          BIANJIE_AI_USERNAME: ${{ secrets.BIANJIE_AI_USERNAME }}
          BIANJIE_AI_PASSWORD: ${{ secrets.BIANJIE_AI_PASSWORD }}
          SOPHNET_TOKENS: ${{ secrets.SOPHNET_TOKENS }}
          MONKEYCODE_COOKIE: ${{ secrets.MONKEYCODE_COOKIE }}
          MONKEYCODE_ACCOUNTS: ${{ secrets.MONKEYCODE_ACCOUNTS }}
          MONKEYCODE_EMAIL: ${{ secrets.MONKEYCODE_EMAIL }}
          MONKEYCODE_PASSWORD: ${{ secrets.MONKEYCODE_PASSWORD }}
          AI_ROUTER_REFRESH_TOKEN: ${{ secrets.AI_ROUTER_REFRESH_TOKEN }}
          AI_ROUTER_TOKEN: ${{ secrets.AI_ROUTER_TOKEN }}
          AI_ROUTER_EMAIL: ${{ secrets.AI_ROUTER_EMAIL }}
          AI_ROUTER_USERNAME: ${{ secrets.AI_ROUTER_USERNAME }}
          AI_ROUTER_PASSWORD: ${{ secrets.AI_ROUTER_PASSWORD }}
          AGENTROUTER_EMAIL: ${{ secrets.AGENTROUTER_EMAIL }}
          AGENTROUTER_PASSWORD: ${{ secrets.AGENTROUTER_PASSWORD }}
          MODELSCOPE_COOKIE: ${{ secrets.MODELSCOPE_COOKIE }}
          MODELSCOPE_AI_COOKIE: ${{ secrets.MODELSCOPE_AI_COOKIE }}
          NAIXI_USERNAME: ${{ secrets.NAIXI_USERNAME }}
          NAIXI_PASSWORD: ${{ secrets.NAIXI_PASSWORD }}
          PCBETA_COOKIE: ${{ secrets.PCBETA_COOKIE }}
          PCBETA_USERNAME: ${{ secrets.PCBETA_USERNAME }}
          PCBETA_PASSWORD: ${{ secrets.PCBETA_PASSWORD }}
          DJI_COOKIE: ${{ secrets.DJI_COOKIE }}
          UGNAS_COOKIE: ${{ secrets.UGNAS_COOKIE }}
          CLOUDSTUDIO_COOKIE: ${{ secrets.CLOUDSTUDIO_COOKIE }}
        run: |
          python3 -c "
          import os, json
          data = {}
          prefixes = [
              'WORKBUDDY_', 'GLADOS_', 'TWO_LIBRA_', 'BIANJIE_', 'SOPHNET_',
              'MONKEYCODE_', 'AI_ROUTER_', 'AGENTROUTER_', 'MODELSCOPE_',
              'NAIXI_', 'PCBETA_', 'DJI_', 'UGNAS_', 'CLOUDSTUDIO_'
          ]
          for k, v in os.environ.items():
              if v and any(k.startswith(p) for p in prefixes):
                  data[k] = v
          with open('secrets_export.json', 'w', encoding='utf-8') as f:
              json.dump(data, f)
          print(f'Exported {len(data)} secrets to secrets_export.json')
          "

      - name: Upload Export Artifact
        uses: actions/upload-artifact@v4
        with:
          name: secrets-export
          path: secrets_export.json
          retention-days: 1
