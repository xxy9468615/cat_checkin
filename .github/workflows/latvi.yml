name: Latvi Check-in

on:
  schedule:
    # 北京时间 18:00（UTC 10:00）兜底锚点：接力链活着时被幂等闸门快速放行（~20s），
    # 链断裂（QStash/GitHub dispatch 失败）时当天补签并重建接力链
    - cron: "0 10 * * *"
  workflow_dispatch:
  repository_dispatch:
    types: [latvi_next_sign]

permissions:
  contents: read

concurrency:
  group: latvi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  latvi:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 常规接力 run ~20s；上限给足 QStash 失败回退等待/冷却重试的余量

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"  # 与本地开发环境对齐，避免 3.12-only 语法只在 CI 爆

      - name: Set TODAY
        run: echo "TODAY=$(TZ=Asia/Shanghai date +%Y-%m-%d)" >> "$GITHUB_ENV"

      - name: Syntax check (stdlib only)
        run: python3 -m py_compile scripts/*.py

      # 缓存不可变：固定 key 会让 save 被跳过（状态永不更新）。
      # 用 run_id 做唯一 key 写入，靠 restore-keys 前缀回退到上一次的状态。
      - name: Restore latvi state
        uses: actions/cache/restore@v4
        with:
          path: .latvi_state.json
          key: latvi-state-${{ github.run_id }}
          restore-keys: |
            latvi-state-

      - name: Run Latvi check-in
        env:
          LATVI_EMAIL: ${{ secrets.LATVI_EMAIL }}
          LATVI_PASSWORD: ${{ secrets.LATVI_PASSWORD }}
          LATVI_STATE_FILE: .latvi_state.json
          TASK_OUTPUT_DIR: .task_results
          # 常规路径（dispatch 接力）几十秒完成；TASK_TIMEOUT 7000s 兜底两条慢路径：
          # ① QStash 调度失败回退原地等待 ② 服务端冷却重试的 sleep 循环
          TASK_TIMEOUT: "7000"
          # QStash 延时接力调度（签到成功后 +24h+3~5min dispatch 下一轮）
          GITHUB_REPO: ${{ github.repository }}
          QSTASH_URL: ${{ secrets.QSTASH_URL }}
          QSTASH_TOKEN: ${{ secrets.QSTASH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: |
          python3 scripts/run_task.py scripts/latvi.py

      - name: Save latvi state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .latvi_state.json
          key: latvi-state-${{ github.run_id }}

      - name: Cache task result
        if: always()
        uses: actions/cache@v4
        with:
          path: .task_results/
          key: task-result-latvi.py-${{ env.TODAY }}

      # 冗余备份：artifact 独立于 cache，防止 cache 保存偶发静默失败时 report 读不到结果
      - name: Upload task result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: task-result-latvi.py
          path: .task_results/
          retention-days: 1
          include-hidden-files: true
